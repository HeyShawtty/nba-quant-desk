<title>NBA Quant Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: a control-room desk. A sticky desk bar; Tonight opens on a three-card podium (the calls), then a ranked call sheet
   beside the parlay desk, then a game rail that drives one open game sheet (margin curve, favorite lines, ladders, tickets).
   Last night, Trends, Record and Model are reading rooms on the same 1240px column. One accent = the model's call. */
:root {
  --bg: #0A0F1A; --panel: #131B2B; --raise: #1B2538; --line: #26324A; --line2: #3A4868;
  --ink: #EDF1F8; --muted: #A9B4C9; --faint: #6F7C97;
  --accent: #4DA3FF; --on-accent: #06121F;
  --good: #3FBF87; --bad: #F0685C; --warn: #E3B341;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F5F9; --panel: #FFFFFF; --raise: #EEF1F6; --line: #DADFE9; --line2: #BFC7D6;
  --ink: #111A2B; --muted: #566179; --faint: #8791A6;
  --accent: #1A66CC; --on-accent: #FFFFFF;
  --good: #19794F; --bad: #BC382B; --warn: #94640A; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #F3F5F9; --panel: #FFFFFF; --raise: #EEF1F6; --line: #DADFE9; --line2: #BFC7D6;
  --ink: #111A2B; --muted: #566179; --faint: #8791A6;
  --accent: #1A66CC; --on-accent: #FFFFFF;
  --good: #19794F; --bad: #BC382B; --warn: #94640A; color-scheme: light }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1240px; margin: 0 auto }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; margin: 0; line-height: 1.05 }
h2 { font-size: 34px } h3 { font-size: 22px } h4 { font-size: 17px; letter-spacing: .04em }
p { margin: 0; max-width: 72ch }
a { color: var(--accent) }
button, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: 13px } .tiny { font-size: 12px }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.good { color: var(--good) } .bad { color: var(--bad) } .warnc { color: var(--warn) } .acc { color: var(--accent) }
b, strong { font-weight: 600 }

/* desk bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0 }
.brand svg { width: 34px; height: 34px; flex: none }
.brand h1 { font-size: 28px; letter-spacing: .06em; white-space: nowrap }
.brand h1 em { font-style: normal; color: var(--accent) }
.brand .when { font-size: 13px; color: var(--muted) }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto }
.tab { border: 0; background: none; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.tab:hover { color: var(--ink); background: var(--raise) }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent) }

main .wrap { display: grid; gap: 30px; padding-top: 22px }
.view { display: grid; gap: 30px }
.view > *, main .wrap > * { min-width: 0 }
.head { display: grid; gap: 8px }
.status { display: flex; flex-wrap: wrap; gap: 6px 8px }
.stat-chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; background: var(--panel) }
.stat-chip b { color: var(--ink) }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0 }
.panel > h3 + p, .panel > .eyebrow + h3 { margin-top: 4px }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px }
.two > *, .three > *, .split > * { min-width: 0 }
.tscroll { overflow-x: auto; min-width: 0 }

/* chips and tiers */
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--raise); color: var(--muted); white-space: nowrap; border: 1px solid var(--line) }
.chip.up { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent) }
.chip.down { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent) }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent) }
.chip.call { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent) }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px }
.tier { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 9px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor }
.t-strong { color: var(--good) } .t-solid { color: var(--ink) } .t-upset { color: var(--warn) } .t-coin { color: var(--bad) }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: top }
th.l, td.l { text-align: left }
td.l { font-family: var(--body); white-space: normal }
tbody tr:last-child td { border-bottom: 0 }
tr.tot td { border-top: 1px solid var(--line2); font-weight: 600 }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--raise); vertical-align: middle; overflow: hidden }
.meter i { display: block; height: 100%; background: var(--muted); border-radius: 3px }
.meter.call i { background: var(--accent) }

/* podium: the three calls */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.pod { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 16px; display: grid; gap: 8px; min-width: 0; overflow: hidden }
.pod.safe { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)) }
.pod .rank { position: absolute; right: 12px; top: 2px; font-family: var(--display); font-weight: 800; font-size: 84px; line-height: 1; color: var(--raise) }
.pod .who { position: relative; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.pod .team { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .03em }
.pod .pct { position: relative; font-family: var(--display); font-weight: 800; font-size: 72px; line-height: .9; font-variant-numeric: tabular-nums }
.pod.safe .pct { color: var(--accent) }
.pod .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px }
.pod .tk { border-top: 1px dashed var(--line2); padding-top: 8px; font-size: 13px; color: var(--muted) }
.pod .tk b { color: var(--ink) }
.windows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.win-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px }

/* parlay desk */
.legs { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none }
.legs li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 5px }
.legs li:last-child { border-bottom: 0 }
.kv { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px }
.kv div { display: grid }
.kv .v { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1 }
.call-h { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; margin-top: 4px }

/* game desk: rail + sheet */
.desk { display: grid; grid-template-columns: 286px minmax(0, 1fr); gap: 16px; align-items: start }
.rail { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); max-height: calc(100vh - 90px); overflow-y: auto; padding-right: 2px }
.rg { display: grid; gap: 6px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0 }
.rg:hover { border-color: var(--line2) }
.rg[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.rg .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.rg .mu { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; line-height: 1 }
.rg .mu span { color: var(--muted); font-weight: 600 }
.rg .pk { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums }
.rg.off { cursor: default; opacity: .7 }
.wbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise) }
.wbar i { display: block; height: 100%; background: var(--faint) }
.wbar i.call { background: var(--accent) }
.sheet { display: grid; gap: 16px; min-width: 0 }
.sheet > * { min-width: 0 }
.scorebug { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 12px }
.sb-side { display: grid; gap: 0; min-width: 0 }
.sb-side.h { text-align: right }
.sb-abbr { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .05em; line-height: 1 }
.sb-name { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sb-pts { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: .9; font-variant-numeric: tabular-nums }
.sb-side.call .sb-abbr, .sb-side.call .sb-pts { color: var(--accent) }
.sb-mid { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .1em; color: var(--muted); text-align: center; padding-bottom: 10px; text-transform: uppercase }
.wp-labels { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1 }
.wp { position: relative; height: 12px; display: flex; border-radius: 3px; background: var(--raise); margin-top: 6px }
.wp i { display: block; height: 100%; background: var(--faint) }
.wp i:first-child { border-radius: 3px 0 0 3px } .wp i:last-of-type { border-radius: 0 3px 3px 0; flex: 1 }
.wp i.call { background: var(--accent) }
.wp .tick { position: absolute; top: -5px; height: 22px; border-left: 2px dashed var(--ink); transform: translateX(-1px) }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; margin: 0 }
.facts div { display: grid; min-width: 0 }
.facts dt { font-size: 12px; color: var(--muted) }
.facts dd { margin: 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 11px }
.curve { width: 100%; height: auto; display: block }

/* favorite lines */
.favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.fav { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; background: var(--raise) }
.fav .ln { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: .02em }
.fav .ln span { color: var(--accent) }
.fav .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fav .meter { width: 100% }

/* model box score */
.boxes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px }
.boxes > * { min-width: 0 }
.team-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px }
.team-cap .ab { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .05em }
td.pl { text-align: left; font-family: var(--body); white-space: normal; min-width: 190px }
.pbtn { all: unset; cursor: pointer; font-weight: 600; white-space: nowrap }
.pbtn::after { margin-left: 6px }
.pbtn::after { content: "+"; font-family: var(--mono); color: var(--faint) }
.pbtn[aria-expanded="true"]::after { content: "−"; color: var(--accent) }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.st::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 2px }
td .pj { display: block; font-weight: 600; font-size: 15px }
td .fv { display: block; font-size: 11.5px; color: var(--muted) }
td .fv b { color: var(--accent); font-weight: 600 }
.q { color: var(--warn); font-size: 12px }
tr.x td { background: var(--raise); white-space: normal; text-align: left; font-family: var(--body) }
.ladders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px }
.lad { display: grid; gap: 3px; align-content: start; min-width: 0 }
.lad h4 { display: grid; gap: 1px }
.lad h4 span { font-family: var(--mono); font-size: 11.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted) }
.rung { display: grid; grid-template-columns: 34px minmax(0, 1fr) 38px; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted) }
.rung .b { height: 8px; border-radius: 2px; background: var(--panel); overflow: hidden }
.rung .b i { display: block; height: 100%; background: var(--faint); border-radius: 2px }
.rung.safe { color: var(--ink) } .rung.safe .b i { background: var(--muted) }
.rung.is-fav { color: var(--accent); font-weight: 600 } .rung.is-fav .b i { background: var(--accent) }
.rung span:last-child { text-align: right }
svg.tape { width: 96px; height: 26px; vertical-align: middle; overflow: visible }
svg.spark { width: 78px; height: 22px; vertical-align: middle; overflow: visible }
svg.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5 }
svg.spark circle { fill: var(--accent) }

/* tickets */
.tk { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line) }
.tk:first-of-type { border-top: 0 }
.tk .tl { display: flex; justify-content: space-between; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1 }
.tk ul { margin: 0; padding-left: 18px; font-size: 14px }
.band { font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--muted); margin-top: 10px }

/* kpis and bars */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; align-content: start }
.kpi .v { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.kpi p { font-size: 13px; color: var(--muted) }
.bars { display: grid; gap: 8px }
.bar-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px }
.bar-row .track { height: 8px; background: var(--raise); border-radius: 3px; position: relative; overflow: hidden }
.bar-row .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px }
.stackbar { display: flex; height: 20px; border-radius: 4px; overflow: hidden }
.stackbar span { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.won { color: var(--good); font-weight: 600 } .lost { color: var(--bad); font-weight: 600 }

/* last night */
.rv { display: grid; gap: 14px }
.rv-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px }
.rv-score { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .03em }
.rv-score .w { color: var(--ink) } .rv-score .ls { color: var(--muted) }
.verdict { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .1em; padding: 2px 10px; border-radius: 4px; text-transform: uppercase }
.verdict.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good) }
.verdict.no { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad) }
.rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px }
.rv-grid > * { min-width: 0 }
.story { margin: 0; padding-left: 18px; display: grid; gap: 4px }
details { border-top: 1px solid var(--line); padding-top: 10px }
summary { cursor: pointer; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--muted) }
summary:hover { color: var(--ink) }
details[open] summary { margin-bottom: 8px; color: var(--ink) }

/* trends */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.fbtn { border: 1px solid var(--line); background: var(--panel); padding: 4px 12px; border-radius: 999px; cursor: pointer; font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; color: var(--muted) }
.fbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px }
.wl { display: inline-flex; gap: 2px; align-items: flex-end; height: 22px; vertical-align: middle }
.wl i { display: block; width: 5px; border-radius: 1px; background: var(--faint) }
.wl i.w { background: var(--good) } .wl i.lo { background: var(--bad) }
.abs { display: grid; gap: 10px }
.abs-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px }
.abs-h .nm { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase }
.carry { display: grid; gap: 8px }
.steps { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: s }
.steps li { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); counter-increment: s }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--accent) }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.param { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px }
.param .v { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05 }
.param p { font-size: 13px; color: var(--muted) }
.vt { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase }
.vt.yes { color: var(--good) } .vt.no { color: var(--bad) } .vt.ctx { color: var(--warn) }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px }

@media (max-width: 1020px) {
  .desk { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; display: flex; max-height: none; overflow-x: auto; overflow-y: visible; padding-bottom: 4px }
  .rg { flex: 0 0 210px }
  .favs { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .ladders { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 900px) {
  .podium, .windows, .two, .three, .split, .boxes, .rv-grid { grid-template-columns: minmax(0, 1fr) }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 480px) {
  .brand h1 { font-size: 23px } h2 { font-size: 28px }
  .sb-pts { font-size: 56px } .pod .pct { font-size: 60px }
  .kpis { grid-template-columns: minmax(0, 1fr) }
  .favs, .ladders { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) {

}

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const D = window.NBA;
  const $ = id => document.getElementById(id);
  if (!D) { $("view-tonight").innerHTML = '<div class="panel"><h3>Model data not found</h3><p class="muted">This page reads data.js, which the app writes after every run.</p></div>'; return; }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (x, d) => (100 * x).toFixed(d == null ? 1 : d) + "%";
  const f1 = x => x == null ? "–" : Number(x).toFixed(1);
  const am = x => { x = Math.round(x); return x > 0 ? "+" + x : String(x).replace("-", "−"); };
  const sgn = (x, d) => { const v = Number(x).toFixed(d == null ? 1 : d); return (x > 0 ? "+" : x < 0 ? "−" : "") + v.replace("-", ""); };
  const line = x => x > 0 ? "+" + x : x < 0 ? "−" + Math.abs(x) : "PK";
  const games = D.games || [];
  $("brandSub").textContent = D.meta.slateLabel;

  // ---------- season-bank flags -> chips ----------
  function chip(flag) {
    const f = flag.toLowerCase(); let cls = "", t = "";
    if (f.indexOf("minutes rising") === 0) { t = "Minutes ↑"; cls = "up"; }
    else if (f.indexOf("minutes falling") === 0) { t = "Minutes ↓"; cls = "down"; }
    else if (f.indexOf("breakout") === 0) { t = "Breakout"; cls = "up"; }
    else if (f.indexOf("bigger role") === 0) { t = "Bigger role"; cls = "up"; }
    else if (f.indexOf("more minutes tonight") === 0) { t = "More minutes tonight"; cls = "up"; }
    else if (f.indexOf("hot") === 0 || f.indexOf("scoring up") === 0) { t = "Hot"; cls = "up"; }
    else if (f.indexOf("scoring down") === 0) { t = "Cooling"; cls = "down"; }
    else if (f.indexOf("first nba season") === 0) { t = "Rookie producing"; cls = "up"; }
    else if (f.indexOf("moved into the starting") === 0) { t = "New starter"; cls = "up"; }
    else if (f.indexOf("moved to the bench") === 0) { t = "To bench"; cls = "down"; }
    else if (f.indexOf("steady scorer") === 0) { t = "Steady"; }
    else return "";
    return `<span class="chip ${cls}" title="${esc(flag)}">${esc(t)}</span>`;
  }
  function biasChip(b, n) {
    if (b == null || n < 3 || Math.abs(b) < 2) return "";
    return b < 0 ? `<span class="chip up" title="Model projection minus actual points, average over ${n} games">Model low by ${Math.abs(b).toFixed(1)}</span>`
                 : `<span class="chip down" title="Model projection minus actual points, average over ${n} games">Model high by ${b.toFixed(1)}</span>`;
  }
  function chips(p) {
    const seen = {}, out = [];
    (p.flags || []).forEach(fl => { const c = chip(fl); if (c && !seen[c]) { seen[c] = 1; out.push(c); } });
    const b = biasChip(p.bias, p.biasN); if (b) out.push(b);
    return out.length ? `<div class="chips">${out.join("")}</div>` : "";
  }

  // ---------- upset-risk tiers (favorite's win chance; season record per tier from the walk-forward backtest) ----------
  const TIERS = [
    { lo: .75, key: "strong", label: "Strong", range: "75%+" },
    { lo: .65, key: "solid", label: "Solid", range: "65–75%" },
    { lo: .55, key: "upset", label: "Upset zone", range: "55–65%" },
    { lo: 0, key: "coin", label: "Coin flip", range: "under 55%" }
  ];
  const favP = g => Math.max(g.winHome, 1 - g.winHome);
  const tierOf = p => { for (let i = 0; i < TIERS.length; i++) if (p >= TIERS[i].lo) return i; return TIERS.length - 1; };
  function tierChip(p) {
    const i = tierOf(p), t = TIERS[i], b = D.tiers && D.tiers.bands[i];
    const tip = b && b.n ? ` title="Favorites at ${t.range} this season: ${b.won} of ${b.n} won (${f1(b.exp)} expected)"` : "";
    return `<span class="tier t-${t.key}"${tip}>${t.label}</span>`;
  }
  const valueSpan = ev => ev == null ? "–" : `<span class="${ev >= 0 ? "good" : "bad"}">${sgn(100 * ev)}%</span>`;

  // ---------- shared pieces ----------
  const fair = p => { if (!(p > 0 && p < 1)) return "–"; const a = p >= .5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; return am(a); };
  const NA = '<span class="na">Unavailable</span>';
  const tipMin = t => { const m = /(\d{1,2}):(\d{2})\s*([AP])M/.exec(t || ""); return m ? ((+m[1] % 12) + (m[3] === "P" ? 12 : 0)) * 60 + +m[2] : 9999; };
  const irStamp = () => { const m = /(\d{1,2}\/\d{1,2}\/\d{2,4}\s+\d{1,2}:\d{2}\s*[AP]M\s*ET)/.exec(D.meta.injuryReport || ""); return m ? m[1] : (D.meta.injuryReport ? D.meta.injuryReport : ""); };
  // value words: color is never the only signal
  const evCell = ev => ev == null ? NA : `<span class="${ev >= .05 ? "good" : ev < 0 ? "bad" : ""}">${sgn(100 * ev)}%</span>`;
  const edgePts = (p, mkt) => mkt == null || isNaN(mkt) ? NA : sgn(100 * (p - mkt)) + " pts";
  function statusChip(p) {
    if (!p || !p.status) return "";
    if (p.status === "locked") return '<span class="chip" title="Tipped. These are its numbers from the last run before tip-off.">Locked at tip</span>';
    if (p.status === "final") return '<span class="chip up" title="Priced on the injury report just before tip-off">Final</span>';
    return '<span class="chip warn" title="Priced on an earlier injury report. It is repriced on the newest report shortly before tip-off when that run succeeds.">Provisional</span>';
  }

  // one row per game on the slate: games still to tip (full detail) plus tipped games kept at their last pre-tip numbers
  function slateRows() {
    const S = D.safest, picks = {};
    if (S && S.windows) S.windows.forEach(w => w.picks.forEach(p => { picks[p.team + "|" + p.opp] = p; }));
    if (S && S.overall) S.overall.forEach(p => { picks[p.team + "|" + p.opp] = picks[p.team + "|" + p.opp] || p; });
    const rows = games.map((g, i) => {
      const home = g.winHome >= .5, team = home ? g.home : g.away, opp = home ? g.away : g.home, pk = picks[team + "|" + opp];
      return { i, team, opp, at: home ? "vs" : "@", away: g.away, home: g.home, tip: g.tip, p: favP(g), ml: home ? g.dk.mlHome : g.dk.mlAway, mkt: home ? g.marketWinHome : 1 - g.marketWinHome,
        ev: (home ? g.dk.mlHome : g.dk.mlAway) ? (home ? g.evHome : g.evAway) : null, score: wholeScore(g).join("–"), blow: g.pBlowout, status: pk ? pk.status : "provisional", pk: pk || { status: "provisional" } };
    });
    Object.keys(picks).forEach(k => { const p = picks[k]; if (rows.some(r => r.team === p.team && r.opp === p.opp)) return;
      rows.push({ i: -1, team: p.team, opp: p.opp, at: p.at, away: p.at === "@" ? p.team : p.opp, home: p.at === "@" ? p.opp : p.team, tip: p.tip, p: p.p, ml: p.ml, mkt: null, ev: p.ev, score: null, blow: null, status: p.status || "locked", pk: p }); });
    return rows;
  }

  // ---------- TONIGHT ----------
  let sel = 0, msec = "overview", sortKey = "p", sortDir = -1, fWin = "all", fStatus = "all";
  function featCard(r, kind) {
    const unfav = r.ev != null && r.ev < 0;
    return `<article class="fcard"><div class="fc-top"><span class="fc-mu">${esc(r.away)} @ ${esc(r.home)}</span><span class="muted small">${esc(r.tip)}</span></div>
      <div class="fc-main"><div><span class="lbl">${kind === "value" ? "Side" : "Model pick"}</span><span class="fc-team">${esc(r.team)}</span></div><div><span class="lbl">Win chance</span><span class="fc-pct">${pct(r.p)}</span></div><div><span class="lbl">Projected score</span><span class="fc-num">${r.score || NA}</span></div></div>
      <dl class="fc-facts"><div><dt>DraftKings</dt><dd>${r.ml ? am(r.ml) : NA}</dd></div><div><dt>Model fair odds</dt><dd>${fair(r.p)}</dd></div><div><dt>Expected return</dt><dd>${evCell(r.ev)}</dd></div><div><dt>Edge on DraftKings</dt><dd>${edgePts(r.p, r.mkt)}</dd></div></dl>
      <div class="fc-foot"><span class="row">${kind === "value" ? "" : tierChip(r.p)}${kind === "value" ? '<span class="chip warn">Unproven value</span>' : unfav ? '<span class="chip down" title="The model agrees this team is likely to win, but the DraftKings price pays less than that chance is worth.">Likely winner, price unfavorable</span>' : r.ev != null ? '<span class="chip up">Price fair or better</span>' : ""}${statusChip(r.pk)}</span>
        ${r.i >= 0 ? `<button class="btn" type="button" data-view-game="${r.i}">View matchup</button>` : '<span class="muted small">Tipped</span>'}</div></article>`;
  }
  function featured(rows) {
    const top = rows.slice().sort((a, b) => b.p - a.p).slice(0, 3), val = [];
    games.forEach((g, i) => [{ team: g.away, opp: g.home, p: 1 - g.winHome, ml: g.dk.mlAway, ev: g.evAway, mkt: 1 - g.marketWinHome }, { team: g.home, opp: g.away, p: g.winHome, ml: g.dk.mlHome, ev: g.evHome, mkt: g.marketWinHome }]
      .forEach(s => { if (s.ml && s.ev >= .05) val.push(Object.assign(s, { i, away: g.away, home: g.home, tip: g.tip, score: wholeScore(g).join("–"), pk: (rows.filter(r => r.i === i)[0] || {}).pk })); }));
    val.sort((a, b) => b.ev - a.ev);
    const bt = D.tiers && D.tiers.edges;
    return `<section class="stack" aria-label="Featured picks"><div class="two-h"><div class="stack"><div class="sec-h"><h3>Highest win probabilities</h3><span class="muted small">Who is most likely to win. Not a statement about price.</span></div>${top.length ? top.map(r => featCard(r, "win")).join("") : '<div class="panel muted">No games priced.</div>'}</div>
      <div class="stack"><div class="sec-h"><h3>Best betting value</h3><span class="muted small">Sides paying 5%+ more than the model's chance is worth.</span></div>${val.length ? val.slice(0, 3).map(r => featCard(r, "value")).join("") : '<div class="panel"><b>No qualifying bet.</b> <span class="muted">No side is priced 5% or more above the model\'s chance.</span></div>'}
        <p class="small muted">${bt && bt.n ? `Sides like these won ${bt.won} of ${bt.n} in the season backtest (${f1(bt.exp)} expected), ${sgn(bt.units)} units at 1 unit a bet. ` : ""}Value sides are unproven; keep them out of parlays.</p></div></div></section>`;
  }
  const COLS = [["tip", "Tip", "l"], ["mu", "Matchup", "l"], ["team", "Pick", "l"], ["p", "Win"], ["score", "Projected score"], ["ml", "DraftKings"], ["fair", "Fair odds"], ["edge", "Edge"], ["ev", "Exp. return"], ["blow", "Decided by 20+"], ["status", "Status", "l"], ["", "", "l"]];
  function slateTable(rows) {
    const val = { tip: r => tipMin(r.tip), mu: r => r.away, team: r => r.team, p: r => r.p, score: r => r.i, ml: r => r.ml || 0, fair: r => r.p, edge: r => r.mkt == null ? -9 : r.p - r.mkt, ev: r => r.ev == null ? -9 : r.ev, blow: r => r.blow == null ? -9 : r.blow, status: r => r.status };
    let list = rows.filter(r => (fWin === "all" || (fWin === "early" ? tipMin(r.tip) < 1260 : tipMin(r.tip) >= 1260)) && (fStatus === "all" || r.status === fStatus));

      `<tr class="${r.i === sel ? "on" : ""}"><td class="l">${esc(r.tip)}</td><td class="l">${esc(r.away)} @ ${esc(r.home)}</td><td class="l"><b>${esc(r.team)}</b> ${tierChip(r.p)}</td><td><b class="acc">${pct(r.p)}</b></td><td>${r.score || NA}</td><td>${r.ml ? am(r.ml) : NA}</td><td>${fair(r.p)}</td><td>${edgePts(r.p, r.mkt)}</td><td>${evCell(r.ev)}</td><td class="${r.blow >= .4 ? "warnc" : ""}">${r.blow == null ? NA : pct(r.blow, 0)}</td><td class="l">${statusChip(r.pk)}</td><td class="l">${r.i >= 0 ? `<button class="btn sm" type="button" data-view-game="${r.i}">View</button>` : ""}</td></tr>`).join("") || `<tr><td class="l muted" colspan="12">No game fits these filters.</td></tr>`}</tbody></table>`;

  // the simulated margin as a curve (normal shape from the simulations' average margin and spread)
  function curve(g) {
    const mu = g.margin, sd = g.sdMargin; if (mu == null || !sd) return "";
    const W = 480, H = 120, L = 6, T = 20, B = 24, pw = W - 2 * L, ph = H - T - B;
    const lim = Math.max(30, Math.ceil((Math.abs(mu) + 2.4 * sd) / 10) * 10);
    const x = m => L + (m + lim) / (2 * lim) * pw, f = m => Math.exp(-(m - mu) * (m - mu) / (2 * sd * sd)), y = v => T + (1 - v) * ph;
    const area = (a, b) => { let d = `M${x(a).toFixed(1)},${y(0).toFixed(1)}`; for (let k = 0; k <= 48; k++) { const m = a + (b - a) * k / 48; d += ` L${x(m).toFixed(1)},${y(f(m)).toFixed(1)}`; } return d + ` L${x(b).toFixed(1)},${y(0).toFixed(1)} Z`; };

    s += `<path d="${area(-lim, 0)}" fill="${homePick ? "var(--faint)" : "var(--accent)"}" fill-opacity=".45"/><path d="${area(0, lim)}" fill="${homePick ? "var(--accent)" : "var(--faint)"}" fill-opacity=".45"/><line x1="${L}" x2="${W - L}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)" stroke-width="1"/>`;
    [-20, 0, 20].forEach(m => { s += `<line x1="${x(m)}" x2="${x(m)}" y1="${y(0)}" y2="${y(0) + 4}" stroke="var(--muted)" stroke-width="1"/><text x="${x(m)}" y="${H - 6}" text-anchor="middle">${m === 0 ? "EVEN" : esc(m < 0 ? g.away : g.home) + " +20"}</text>`; });
    s += `<line x1="${x(mu)}" x2="${x(mu)}" y1="${y(1)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
    if (Math.abs(dkm) <= lim) s += `<line x1="${x(dkm)}" x2="${x(dkm)}" y1="${T - 4}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;

    if (Math.abs(dkm) <= lim) s += `<text x="${x(dkm)}" y="${T - 8}" text-anchor="${near ? (left ? "start" : "end") : "middle"}" dx="${near ? (left ? 4 : -4) : 0}">DK ${sgn(dkm)}</text>`;

  function tape(log, idx, ln) {

  function playerList(list) {

      return `<button class="plb" type="button" data-pkey="${esc(e.key)}" aria-pressed="${e.key === pSel}"><span class="pl-n">${esc(e.p.name)}${e.p.status === "Q" ? ' <span class="chip warn">Q</span>' : ""}</span><span class="muted small">${esc(e.team)} · ${f1(e.p.min)} min · ${f1(e.p[st[1]])} ${st[1] === "tpm" ? "threes" : st[1]}${f ? " · " + f[0] + "+ " + pct(f[1], 0) : ""}</span></button>`; }).join("") || '<p class="muted small">No player matches.</p>';

  // ---------- matchup ----------
  function ticket(c, bar, label) {

    return `<div class="tkt"><div class="tkt-h"><span>${label}</span>${ok ? '<span class="chip up">Qualifies</span>' : `<span class="chip warn">No qualifying ticket</span>`}</div>
      ${ok ? "" : `<p class="small muted">Best combination found is ${pct(c.joint)}, under the ${pct(bar, 0)} bar. Shown for reference only.</p>`}
      <table class="legt"><tbody>${c.legs.map((l, i) => `<tr><td class="l">${esc(l)}</td><td>${pct(c.legP[i], 0)}</td></tr>`).join("")}</tbody></table>

    return fl;
  }
  // projected final as whole numbers; a rounding tie goes to the model's pick
  function wholeScore(g) {

    return [a, h];

  // the model's box score in whole numbers: each player's share of the simulated team total (his line times the chance he

  }
  function matchup(g, gi) {
    if (!g) return "";

    const secs = [["overview", "Overview"], ["ladders", "Player ladders"], ["box", "Projected box score"], ["inj", "Injuries"]];
    const head = `<div class="sec-h"><div class="ctl"><label for="mg">Matchup</label><select id="mg">${games.map((x, i) => `<option value="${i}"${i === gi ? " selected" : ""}>${esc(x.away)} @ ${esc(x.home)} · ${esc(x.tip)}</option>`).join("")}</select></div>

          <div class="wp" role="img" aria-label="Win chance: ${esc(g.away)} ${pct(wa)}, ${esc(g.home)} ${pct(g.winHome)}"><i class="${homePick ? "" : "call"}" style="width:${(100 * wa).toFixed(1)}%"></i><i class="${homePick ? "call" : ""}"></i><span class="tick" style="left:${(100 * kA).toFixed(1)}%"></span></div>
          <div class="small muted" style="margin-top:6px">Dashed mark: DraftKings has ${esc(g.marketWinHome >= .5 ? g.home : g.away)} at ${pct(Math.max(g.marketWinHome, kA))}. ${tierChip(favP(g))}</div></div>

        ${blowNote}<div class="work"><div class="plist" role="group" aria-label="Players in this game">${mine.sort((a, b) => b.p.min - a.p.min).map(e => `<button class="plb" type="button" data-mkey="${esc(e.key)}" aria-pressed="${e.key === pSel}"><span class="pl-n">${esc(e.p.name)}${e.p.status === "Q" ? ' <span class="chip warn">Q</span>' : ""}</span><span class="muted small">${esc(e.team)} · ${f1(e.p.min)} min</span></button>`).join("")}</div><div>${playerPanel(roster.filter(e => e.key === pSel)[0])}</div></div>`; }

  // ---------- LAST NIGHT ----------

            <tr><td class="l"><b>${esc(g.away)}</b></td>${g.awayQ.map(q => `<td>${q}</td>`).join("")}<td><b>${g.awayPts}</b></td></tr>

          <div><span class="eyebrow">Player calls</span><p class="small">Calls at 80% or better: <b>${g.hiHit} of ${g.hiN}</b> hit. Calls at 60–80%: <b>${g.midHit} of ${g.midN}</b>.${g.favN ? ` Favorite lines: <b>${g.favHit} of ${g.favN}</b>.` : ""}</p>

          return `<tr><td class="l"><b>${esc(p.name)}</b> <span class="muted">${esc(p.team)}</span></td><td>${pv(p.pMin, p.min)}</td><td class="${d >= 7 ? "good" : d <= -7 ? "bad" : ""}">${pv(p.pPts, p.pts)}</td><td>${pv(p.pReb, p.reb)}</td><td>${pv(p.pAst, p.ast)}</td><td>${pv(p.p3, p.tpm)}</td><td>${esc(p.fg)}</td><td>${p.pf}</td><td class="l small muted">${esc(p.cause)}</td></tr>`; }).join("")}

  function renderReview() {

        <div class="kpi"><span class="eyebrow">Player calls at 80%+</span><span class="v">${hiHit} of ${hiN}</span><p>${f1(hiExp)} expected</p></div>
        <div class="kpi"><span class="eyebrow">Safest four-leg tickets</span><span class="v">${R.safestN ? R.safestHit + " of " + R.safestN : "–"}</span><p>${R.safestN ? f1(R.safestExp) + " expected" : "none graded"}${R.favN ? ` · favorite lines ${R.favHit} of ${R.favN} (${f1(R.favExp)} expected)` : ""}</p></div>
        <div class="kpi"><span class="eyebrow">Minutes against projection</span><span class="v">${sgn(R.minBias)}</span><p>per rotation player (${R.mainN} players) · average miss ${f1(R.minMae)} minutes, ${f1(R.ptsMae)} points</p></div>

  function spark(arr) {

    return `<svg class="spark" viewBox="0 0 ${w} ${hh}" role="img" aria-label="${arr.join(", ")}"><title>${arr.join(", ")}</title><polyline points="${pts.join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5"/></svg>`;

  // ---------- RECORD ----------
  function reliabilitySvg(rel) {
    const W = 340, H = 300, L = 44, B = 36, T = 12, R = 12, pw = W - L - R, ph = H - T - B, x = v => L + v * pw, y = v => T + (1 - v) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Reliability: stated chance against how often it happened">`;
    [0, .2, .4, .6, .8, 1].forEach(v => { s += `<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text><text x="${x(v)}" y="${H - B + 16}" text-anchor="middle">${v * 100}%</text>`; });
    s += `<text x="${L + pw / 2}" y="${H - 4}" text-anchor="middle">Stated chance</text><line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
    const maxN = Math.max.apply(null, rel.map(b => b.n));
    s += `<polyline points="${rel.map(b => x(b.pred) + "," + y(b.obs)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    rel.forEach(b => { s += `<circle cx="${x(b.pred)}" cy="${y(b.obs)}" r="${(3 + 6 * Math.sqrt(b.n / maxN)).toFixed(1)}" fill="var(--accent)" fill-opacity=".85"><title>${pct(b.lo, 0)}–${pct(b.hi, 0)}: stated ${pct(b.pred)}, happened ${pct(b.obs)} (${b.n.toLocaleString()} calls)</title></circle>`; });
    return s + "</svg>";
  }
  const barRow = (label, v, max, color, txt) => `<div class="bar-row"><span>${esc(label)}</span><span class="track"><span class="fill" style="width:${Math.max(0, Math.min(100, 100 * v / max)).toFixed(1)}%;background:${color}"></span></span><span class="num" style="text-align:right">${txt}</span></div>`;
  function renderRecord() {
    const a = D.audit, r = D.record, F = D.favRecord;
    let h = '<div class="head"><h2>Where the simulation succeeds and fails</h2><p class="muted">Walk-forward backtest: each date is simulated using only earlier games, then graded against the box scores. The live record below it covers what was published before tip-off.</p></div>';
    if (a) {
      h += `<div class="kpis"><div class="kpi"><span class="eyebrow">Player-line calls</span><span class="v">${a.props.toLocaleString()}</span><p>${a.games} games · stated ${pct(a.propPred)}, happened ${pct(a.propObs)}</p></div>
        <div class="kpi"><span class="eyebrow">Calls at 80%+</span><span class="v">${pct(a.confHit)}</span><p>hit rate on ${a.confN.toLocaleString()} calls</p></div>
        <div class="kpi"><span class="eyebrow">Picking winners</span><span class="v">${a.mlBrier.toFixed(3)}</span><p>accuracy score against DraftKings ${a.mlBrierMkt.toFixed(3)} (lower is better)</p></div>
        <div class="kpi"><span class="eyebrow">Points miss per player</span><span class="v">${a.ptsMae.toFixed(1)}</span><p>average · minutes miss ${a.minMae.toFixed(1)}</p></div></div>`;
      const segs = a.segments.filter(s => s.group.indexOf("hindsight") < 0 && s.group !== "Overall" && s.n >= 1500).sort((p, q) => q.skill - p.skill);
      h += `<div class="two"><div class="panel"><h3>Are the chances honest?</h3><p class="small muted" style="margin:4px 0 8px">Each dot is a band of calls. On the dashed line, a 60% call happens 60% of the time. Bigger dots hold more calls.</p>${reliabilitySvg(a.reliability)}</div>
        <div class="panel"><h3>Strongest and weakest situations</h3><p class="small muted" style="margin:4px 0 8px">Skill = how much better than always guessing the average for that line.</p><div class="bars"><span class="eyebrow">Strongest</span>${segs.slice(0, 6).map(s => barRow(s.name + " · " + s.group, s.skill, .55, "var(--good)", pct(s.skill, 0))).join("")}<span class="eyebrow" style="margin-top:8px">Weakest</span>${segs.slice(-6).reverse().map(s => barRow(s.name + " · " + s.group, s.skill, .55, "var(--bad)", pct(s.skill, 0))).join("")}</div></div></div>`;
      const cc = { "minutes short": "var(--bad)", "blowout": "var(--warn)", "minutes surplus": "var(--accent)", "normal minutes": "var(--faint)" };
      const tm = a.causes.reduce((s, c) => s + c.miss, 0), th = a.causes.reduce((s, c) => s + c.hit, 0), ms = a.causes.filter(c => c.cause === "minutes short")[0];
      const stackbar = (key, tot) => `<div class="stackbar">${a.causes.map(c => `<span title="${esc(c.cause)}: ${c[key]}" style="width:${(100 * c[key] / Math.max(1, tot)).toFixed(1)}%;background:${cc[c.cause]}"></span>`).join("")}</div>`;
      const names = { boost_candidate: "Boost parlays", sgp_best_hit: "Safest 3-leg", sgp_most_correlated: "Most correlated", sgp_4leg: "Four-leg", best_sgp: "Best boost pick" };
      h += `<div class="two"><div class="panel"><h3>Why confident calls miss</h3><p class="small muted" style="margin:4px 0 10px">${ms ? pct(ms.miss / Math.max(1, tm), 0) + " of misses on 80%+ calls came when the player logged 6+ fewer minutes than projected, against " + pct(ms.hit / Math.max(1, th), 0) + " of hits. Minutes, not shooting, are the main failure." : ""}</p>
          <div style="display:grid;gap:8px"><span class="eyebrow">Misses (${tm})</span>${stackbar("miss", tm)}<span class="eyebrow">Hits (${th})</span>${stackbar("hit", th)}</div><div class="legend" style="margin-top:10px">${Object.keys(cc).map(k => `<span><i style="background:${cc[k]}"></i>${k}</span>`).join("")}</div></div>
        <div class="panel"><h3>Do parlays priced together hold up?</h3><p class="small muted" style="margin:4px 0 10px">The simulation prices legs from the same games. Treated as independent, most parlays would look less likely than they turned out to be.</p><div class="bars">${a.sgp.filter(x => x.n >= 20).map(x => `<span class="eyebrow" style="margin-top:4px">${esc(names[x.tag] || x.tag)} · ${x.n} tickets</span>` + barRow("Simulated together", x.joint, 1, "var(--accent)", pct(x.joint, 0)) + barRow("Independent legs", x.indep, 1, "var(--faint)", pct(x.indep, 0)) + barRow("Actually hit", x.obs, 1, "var(--ink)", pct(x.obs, 0))).join("")}</div></div></div>`;
    }
    if (F) {
      const row = (label, x) => `<tr><td class="l">${label}</td><td>${x.n ? x.hit + " of " + x.n : "–"}</td><td>${x.n ? pct(x.pred, 0) : "–"}</td><td class="${x.n ? (x.hit / x.n >= x.pred - .02 ? "won" : "lost") : ""}">${x.n ? pct(x.hit / x.n, 0) : "–"}</td></tr>`;
      h += `<div class="panel"><span class="eyebrow">Favorite lines</span><h3>How the model's favorites have done</h3><p class="small muted" style="margin:4px 0 8px">A favorite is the highest ladder line a player clears at ${pct(F.min, 0)} or better. Every one is saved before tip-off and graded. Live counts begin the day favorites launched; the backtest replays the season with earlier games only.</p>
        <div class="tscroll"><table><thead><tr><th class="l">Set</th><th>Hit</th><th>Stated</th><th>Hit rate</th></tr></thead><tbody>${row("Live, all favorites", F.live)}${row("Live, bold favorites (80%+ of his season average)", F.liveBold)}${row("Backtest, all favorites", F.backtest)}${row("Backtest, bold favorites", F.backtestBold)}${F.byStat.map(s => row("Backtest, " + esc(STATNAME[s.stat] || s.stat).toLowerCase(), s.backtest)).join("")}</tbody></table></div></div>`;
    }
    const tagNames = { top3_ml: "Top-3 moneylines", top5_dd: "Double-double picks", top5_25pts: "25+ point picks", top5_3pm: "3+ threes picks", top5_q3all: "3+ points every quarter", top5_ffg: "First basket", top3_q3: "Team 100+ through Q3", boost_candidate: "Boost parlays", best_sgp: "Best boost pick", sgp_best_hit: "Safest 3-leg parlay", sgp_most_correlated: "Most correlated parlay", sgp_4leg: "Four-leg parlay", erupt: "Erupt calls", dud: "Dud calls", sgp4_safest: "Four-leg, safest", sgp4_boost_range: "Four-leg, boost range", sgp4_bigger_payout: "Four-leg, bigger payout", fav: "Favorite lines", fav_bold: "Favorite lines, bold", safe3_evening: "Top 3, evening window", safe3_night: "Top 3, night window", ticket: "Custom tickets" };
    h += `<div class="head"><h2>Live record</h2><p class="muted">Published before tip-off, graded afterwards${r.mlBrier != null ? ". Winner accuracy score " + r.mlBrier.toFixed(3) + " against DraftKings " + r.mlBrierMkt.toFixed(3) : ""}.</p></div>
      <div class="two"><div class="panel"><h3>Picks by type</h3><div class="tscroll"><table><thead><tr><th class="l">Pick type</th><th>Hits</th><th>Expected</th><th>Hit rate</th></tr></thead><tbody>${r.tags.map(t => { const exp = t.pred * t.n; return `<tr><td class="l">${esc(tagNames[t.tag] || t.tag)}</td><td>${t.hits}/${t.n}</td><td>${exp.toFixed(1)}</td><td class="${t.hits >= exp ? "won" : "lost"}">${pct(t.hits / t.n, 0)}</td></tr>`; }).join("")}</tbody></table></div></div>
      <div class="panel"><h3>Slate by slate</h3><div class="tscroll"><table><thead><tr><th class="l">Date</th><th>Favorites</th><th>Player lines stated</th><th>Happened</th></tr></thead><tbody>${r.slates.slice().reverse().map(s => `<tr><td class="l">${esc(s.date)}</td><td>${s.favWon} of ${s.games}</td><td>${pct(s.propPred)}</td><td>${pct(s.propObs)}</td></tr>`).join("")}</tbody></table></div></div></div>`;
    $("view-record").innerHTML = h;
  }

  // ---------- MODEL ----------
  function renderModel() {
    const s = D.meta.settings, Lr = D.learn || {};
    const steps = [
      ["Collect the inputs", "Every 2026-27 box score and play-by-play from ESPN, last season's player stats from Basketball-Reference, DraftKings spreads, totals and moneylines, and the NBA's official injury report, read again before each tip-off."],
      ["Project each player", "Minutes blend this season with last season, with this season's games counting " + s.csWeight + "× as much. Per-minute rates for twos, threes, free throws, turnovers, rebounds and assists are pulled toward position averages. Questionable players enter as lineup scenarios."],
      ["Learn from every game", "After each game the projection is compared with what the player did." + (Lr.minTrend > 0 ? " His minutes lean " + pct(Lr.minTrend, 0) + " of the way toward his last three games." : " A minutes rule that leans toward the last three games is tested daily and is off right now.") + (Lr.ptsK > 0 ? " His scoring rate is scaled by how he has done against the model's own projections." : " Scoring-rate learning is tested daily and is off right now.") + (Lr.astK > 0 ? " His assist rate learns the same way." : " Assist-rate learning is tested daily and is off right now.") + " Each rule stays on only while it improves accuracy on both halves of the season."],
      ["Set team strength", (s.marketWeight > 0 ? "Each team's expected score is " + pct(s.marketWeight, 0) + " the DraftKings line and " + pct(1 - s.marketWeight, 0) + " an independent player-rating model" : "Each team's expected score comes from the model's own player ratings and this season's games; DraftKings lines are shown only for comparison and never feed the simulation") + ", with home court worth " + s.hca + " points, a back-to-back penalty, and a shift toward teams that keep beating the model's own margins."],
      ["Simulate " + D.meta.sims.toLocaleString() + " games", "Each game is played possession by possession: the shooter is drawn by usage, shots become twos, threes, free throws or turnovers, then assists and rebounds. Leading teams ease off, starters sit in fourth-quarter blowouts, and ties go to overtime."],
      ["Read the outputs", "Win chances, spreads, totals, every player's stat distribution, the favorite line on each ladder, and joint chances for parlays, all counted from the same simulated games so nothing contradicts anything else."],
      ["Grade and recalibrate", "Every published call is graded from box scores. A walk-forward backtest replays the season using only earlier games, and a setting changes only when it improves accuracy on both the earlier and later halves of the season."]
    ];
    const params = [
      ["Market weight", pct(s.marketWeight, 0), "Share of each team's expected score taken from DraftKings"],
      ["This-season weight", s.csWeight + "×", "Each 2026-27 minute counts this much against last season's"],
      ["Hot-start weight", (Lr.hotStart || 1) + "×", "Extra weight on this season for players outscoring last season's rate"],
      ["Minutes trend", Lr.minTrend > 0 ? pct(Lr.minTrend, 0) : "off", "Share of the gap to his last-three-game minutes that is closed"],
      ["Scoring-rate learning", Lr.ptsK > 0 ? "on" : "off", Lr.ptsK > 0 ? Lr.ptsK + " points of 'as projected' are mixed in before his record counts" : "Tested at every recalibration"],
      ["Assist-rate learning", Lr.astK > 0 ? "on" : "off", Lr.astK > 0 ? Lr.astK + " assists of 'as projected' are mixed in before his record counts" : "Tested at every recalibration"],
      ["Team form", Lr.teamForm != null ? Lr.teamForm : "–", "Share of each team's season surprise against the model's margins that is carried forward"],
      ["Minutes uncertainty", s.sigmaMin, "Night-to-night spread in each player's minutes (log scale)"],
      ["Usage minutes slope", s.minUsageSlope, "Extra projected minutes for high-usage players, fitted out of sample"],
      ["Score effect", s.alpha, "How much a leading team's shot-making eases off as the lead grows"],
      ["Team shooting swing", s.sigmaEff, "Per-game swing in team efficiency"],
      ["Pace swing", s.sigmaPace + " poss.", "Per-game swing in possessions"]
    ];
    const tests = TESTS;
    $("view-model").innerHTML = `<div class="head"><h2>How the model works</h2><p class="muted">A possession-by-possession simulation that runs on its own numbers, grades itself every morning and refits from the results. Last recalibrated ${esc(D.meta.recal)}.</p></div>
      <ol class="steps">${steps.map(x => `<li><div><h3>${esc(x[0])}</h3><p class="muted">${esc(x[1])}</p></div></li>`).join("")}</ol>
      <div class="stack"><h2>Settings in use</h2><div class="params">${params.map(p => `<div class="param"><span class="eyebrow">${esc(p[0])}</span><span class="v">${esc(p[1])}</span><p>${esc(p[2])}</p></div>`).join("")}</div></div>
      <div class="stack"><h2>What was tested</h2><p class="muted">Each idea is replayed over the whole season with earlier games only${D.audit ? " (" + D.audit.games + " games)" : ""}. It goes in only if it helps both halves of the season.</p>
        <div class="panel tscroll"><table><thead><tr><th class="l">Change</th><th>Result</th><th class="l">Evidence</th></tr></thead><tbody>${tests.map(t => `<tr><td class="l">${esc(t[0])}</td><td><span class="vt ${t[1]}">${esc(t[2])}</span></td><td class="l muted">${esc(t[3])}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  // Nov 13 backtests: 162 games, each date priced with earlier games only. Periods: early (before Oct 29), late (Oct 29 to Nov 7),
  // final = untouched confirmation (Nov 8 on). Scores are player-line and win-probability Brier (lower is better).
  const TESTS = [
    ["Learn each player's assist rate from the model's own misses", "yes", "Adopted Nov 13", "Switching it off is worse on both halves (player lines 0.075975 vs 0.075896 early, 0.072802 vs 0.072689 late). Final period mixed: lines slightly better, assist error slightly worse"],
    ["Lean harder on hot starts", "yes", "Kept", "Better on both halves (0.075896 vs 0.075979, 0.072689 vs 0.072785). The final period slightly favors switching it off, so it is watched"],
    ["Lean minutes toward the last three games", "no", "Rejected", "Minutes error better late and final (4.50 vs 4.57, 4.55 vs 4.62) but player-line accuracy worse on both halves (0.075949 vs 0.075896, 0.072821 vs 0.072689)"],
    ["Learn each player's scoring rate from the model's misses", "ctx", "Inconclusive", "Worse early (0.075968 vs 0.075896), better late (0.072563 vs 0.072689) and in the final period. Off; retested every morning"],
    ["Minutes trend plus scoring learning together", "ctx", "Inconclusive", "Player lines better on both halves (0.07672 vs 0.07673, 0.07742 vs 0.07746) but worse in the untouched final period (0.07360 vs 0.07357); win accuracy worse late. Differences are noise-sized. Off"],
    ["Minutes balancing fix (bug)", "yes", "Fixed Nov 13", "Quarters stopped balancing after 4 passes; simulated minutes were 240.47 per team-game against 240.66. Now 240.65 against 240.65"],
    ["Smaller shooting penalty for the leading team (0.25 → 0.15, 0.05, 0)", "no", "Rejected", "It does compress blowouts: 20-point games predicted 23.3% at 0.25, 26.0% at 0.15, 30.5% at 0, against 25.9% actual. But win accuracy got worse in every period (0.15: 0.1940 vs 0.1927 early, 0.1804 vs 0.1785 late, 0.1364 vs 0.1331 final)"],
    ["Later fourth-quarter benching (starts at 16 points)", "no", "Rejected", "Player lines worse early (0.07704 vs 0.07670), better late and final; win accuracy worse on both halves"],
    ["Earlier fourth-quarter benching (starts at 8 points)", "no", "Rejected", "Win accuracy better late and final but player lines worse in all three periods (final 0.07405 vs 0.07353)"],
    ["Team form against the model's own margins", "yes", "Kept", "Win accuracy 0.1972 / 0.1553 with it, 0.1992 / 0.1653 without"],
    ["Wider minutes uncertainty (0.20 → 0.36)", "yes", "Adopted", "Better on both halves; fixed overconfidence in the 80–90% band"],
    ["Recent games count more for season minutes", "no", "Rejected", "Worse on the earlier half every time it is retested"],
    ["Heavier pull toward position averages", "no", "Rejected", "Worse on both halves"],
    ["Per-stat chance correction", "ctx", "PRA only", "Only the combined points-rebounds-assists line improved on held-out dates"],
    ["Opponent defensive matchups", "ctx", "Context only", "Worse at half and full strength"]
  ];

  // ---------- views ----------
  function featuredRecord() {
    const r = D.safest && D.safest.record; if (!r) return "";
    const row = (label, x) => x && x.n ? `<tr><td class="l">${label}</td><td>${x.hits} of ${x.n}</td><td>${pct(x.hits / x.n, 0)}</td><td>${x.pred != null ? pct(x.pred, 0) : NA}</td></tr>` : "";
    return `<div class="panel"><h3>Featured picks, live record</h3><p class="small muted" style="margin:4px 0 8px">Published before tip-off and graded from box scores. Hit rate is what happened; average stated chance is what the model said beforehand.</p>
      <div class="tscroll"><table><thead><tr><th class="l">Pick type</th><th>Hits</th><th>Hit rate</th><th>Average stated chance</th></tr></thead><tbody>${row("Top three win probabilities", r.top3)}${row("Favorites at 70% or better", r.fav70)}${row("Safest four-leg tickets", r.four)}</tbody></table></div></div>`;
  }
  function renderResults() {
    renderReview(); renderRecord();
    $("view-record").insertAdjacentHTML("afterbegin", featuredRecord());
    const v = $("view-results");
    v.addEventListener("click", e => { const b = e.target.closest("[data-res]"); if (!b) return; const k = b.getAttribute("data-res");
      v.querySelectorAll("[data-res]").forEach(x => x.setAttribute("aria-selected", String(x === b))); $("view-review").hidden = k !== "review"; $("view-record").hidden = k !== "record"; });
  }
  const views = ["tonight", "props", "results", "trends", "model"], rendered = {};
  const render = { tonight: renderTonight, props: renderProps, results: renderResults, trends: renderTrends, model: renderModel };
  function show(v) {
    if (views.indexOf(v) < 0) v = "tonight";
    views.forEach(k => { $("view-" + k).hidden = k !== v; $("tab-" + k).setAttribute("aria-selected", String(k === v)); });
    if (!rendered[v]) { try { render[v](); } catch (e) { $("view-" + v).innerHTML = `<div class="panel" role="alert"><h3>This section could not be drawn</h3><p class="muted">${esc(e.message)}. The data on file was built ${esc(D.meta.built)}.</p></div>`; } rendered[v] = 1; }
    try { localStorage.setItem("nqd-view", v); } catch (e) {}
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { const v = t.getAttribute("data-view"); try { history.replaceState(null, "", "#" + v); } catch (e) {} show(v); window.scrollTo(0, 0); }));
  window.addEventListener("hashchange", () => { const v = (location.hash || "").replace("#", ""); if (views.indexOf(v) >= 0) show(v); });
  let start = (location.hash || "").replace("#", "");
  if (views.indexOf(start) < 0) { try { start = localStorage.getItem("nqd-view") || "tonight"; } catch (e) { start = "tonight"; } }
  show(start);
  $("foot").textContent = "Research output from the NBA Quant Desk app. Chances are estimates from simulation, not guarantees, and nothing here is a lock. Data: ESPN, Basketball-Reference, Action Network (DraftKings lines), NBA official injury report.";
})();
</script>
