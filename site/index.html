<title>NBA Quant Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a control-room desk. A sticky desk bar; Tonight opens on a three-card podium (the calls), then a ranked call sheet
   beside the parlay desk, then a game rail that drives one open game sheet (margin curve, favorite lines, ladders, tickets).
   Last night, Trends, Record and Model are reading rooms on the same 1240px column. One accent = the model's call. */
:root {
  --bg: #0A0E16; --panel: #111826; --raise: #182136; --line: #232E45; --line2: #33405E;
  --ink: #E9EDF5; --muted: #8E9AB2; --faint: #5B6780;
  --accent: #4DA3FF; --on-accent: #06121F;
  --good: #3FBF87; --bad: #F0685C; --warn: #E3B341;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F5F9; --panel: #FFFFFF; --raise: #EEF1F6; --line: #DADFE9; --line2: #BFC7D6;
  --ink: #111A2B; --muted: #566179; --faint: #8791A6;
  --accent: #1A66CC; --on-accent: #FFFFFF;
  --good: #19794F; --bad: #BC382B; --warn: #94640A; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #F3F5F9; --panel: #FFFFFF; --raise: #EEF1F6; --line: #DADFE9; --line2: #BFC7D6;
  --ink: #111A2B; --muted: #566179; --faint: #8791A6;
  --accent: #1A66CC; --on-accent: #FFFFFF;
  --good: #19794F; --bad: #BC382B; --warn: #94640A; color-scheme: light }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1240px; margin: 0 auto }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; margin: 0; line-height: 1.05 }
h2 { font-size: 34px } h3 { font-size: 22px } h4 { font-size: 17px; letter-spacing: .04em }
p { margin: 0; max-width: 72ch }
a { color: var(--accent) }
button, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: 13px } .tiny { font-size: 12px }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.good { color: var(--good) } .bad { color: var(--bad) } .warnc { color: var(--warn) } .acc { color: var(--accent) }
b, strong { font-weight: 600 }

/* desk bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0 }
.brand svg { width: 34px; height: 34px; flex: none }
.brand h1 { font-size: 28px; letter-spacing: .06em; white-space: nowrap }
.brand h1 em { font-style: normal; color: var(--accent) }
.brand .when { font-size: 13px; color: var(--muted) }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto }
.tab { border: 0; background: none; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.tab:hover { color: var(--ink); background: var(--raise) }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent) }

main .wrap { display: grid; gap: 30px; padding-top: 22px }
.view { display: grid; gap: 30px }
.view > *, main .wrap > * { min-width: 0 }
.head { display: grid; gap: 8px }
.status { display: flex; flex-wrap: wrap; gap: 6px 8px }
.stat-chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; background: var(--panel) }
.stat-chip b { color: var(--ink) }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0 }
.panel > h3 + p, .panel > .eyebrow + h3 { margin-top: 4px }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px }
.two > *, .three > *, .split > * { min-width: 0 }
.tscroll { overflow-x: auto; min-width: 0 }

/* chips and tiers */
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--raise); color: var(--muted); white-space: nowrap; border: 1px solid var(--line) }
.chip.up { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent) }
.chip.down { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent) }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent) }
.chip.call { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent) }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px }
.tier { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 9px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor }
.t-strong { color: var(--good) } .t-solid { color: var(--ink) } .t-upset { color: var(--warn) } .t-coin { color: var(--bad) }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: top }
th.l, td.l { text-align: left }
td.l { font-family: var(--body); white-space: normal }
tbody tr:last-child td { border-bottom: 0 }
tr.tot td { border-top: 1px solid var(--line2); font-weight: 600 }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--raise); vertical-align: middle; overflow: hidden }
.meter i { display: block; height: 100%; background: var(--muted); border-radius: 3px }
.meter.call i { background: var(--accent) }

/* podium: the three calls */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.pod { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 16px; display: grid; gap: 8px; min-width: 0; overflow: hidden }
.pod.safe { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)) }
.pod .rank { position: absolute; right: 12px; top: 2px; font-family: var(--display); font-weight: 800; font-size: 84px; line-height: 1; color: var(--raise) }
.pod .who { position: relative; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.pod .team { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .03em }
.pod .pct { position: relative; font-family: var(--display); font-weight: 800; font-size: 72px; line-height: .9; font-variant-numeric: tabular-nums }
.pod.safe .pct { color: var(--accent) }
.pod .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px }
.pod .tk { border-top: 1px dashed var(--line2); padding-top: 8px; font-size: 13px; color: var(--muted) }
.pod .tk b { color: var(--ink) }
.windows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.win-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px }

/* parlay desk */
.legs { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none }
.legs li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 5px }
.legs li:last-child { border-bottom: 0 }
.kv { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px }
.kv div { display: grid }
.kv .v { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1 }
.call-h { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; margin-top: 4px }

/* game desk: rail + sheet */
.desk { display: grid; grid-template-columns: 286px minmax(0, 1fr); gap: 16px; align-items: start }
.rail { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); max-height: calc(100vh - 90px); overflow-y: auto; padding-right: 2px }
.rg { display: grid; gap: 6px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0 }
.rg:hover { border-color: var(--line2) }
.rg[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.rg .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.rg .mu { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; line-height: 1 }
.rg .mu span { color: var(--muted); font-weight: 600 }
.rg .pk { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums }
.rg.off { cursor: default; opacity: .7 }
.wbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise) }
.wbar i { display: block; height: 100%; background: var(--faint) }
.wbar i.call { background: var(--accent) }
.sheet { display: grid; gap: 16px; min-width: 0 }
.sheet > * { min-width: 0 }
.scorebug { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 12px }
.sb-side { display: grid; gap: 0; min-width: 0 }
.sb-side.h { text-align: right }
.sb-abbr { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .05em; line-height: 1 }
.sb-name { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sb-pts { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: .9; font-variant-numeric: tabular-nums }
.sb-side.call .sb-abbr, .sb-side.call .sb-pts { color: var(--accent) }
.sb-mid { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .1em; color: var(--muted); text-align: center; padding-bottom: 10px; text-transform: uppercase }
.wp-labels { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1 }
.wp { position: relative; height: 12px; display: flex; border-radius: 3px; background: var(--raise); margin-top: 6px }
.wp i { display: block; height: 100%; background: var(--faint) }
.wp i:first-child { border-radius: 3px 0 0 3px } .wp i:last-of-type { border-radius: 0 3px 3px 0; flex: 1 }
.wp i.call { background: var(--accent) }
.wp .tick { position: absolute; top: -5px; height: 22px; border-left: 2px dashed var(--ink); transform: translateX(-1px) }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; margin: 0 }
.facts div { display: grid; min-width: 0 }
.facts dt { font-size: 12px; color: var(--muted) }
.facts dd { margin: 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 11px }
.curve { width: 100%; height: auto; display: block }

/* favorite lines */
.favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.fav { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; background: var(--raise) }
.fav .ln { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: .02em }
.fav .ln span { color: var(--accent) }
.fav .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fav .meter { width: 100% }

/* model box score */
.boxes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px }
.boxes > * { min-width: 0 }
.team-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px }
.team-cap .ab { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .05em }
td.pl { text-align: left; font-family: var(--body); white-space: normal; min-width: 190px }
.pbtn { all: unset; cursor: pointer; font-weight: 600; white-space: nowrap }
.pbtn::after { margin-left: 6px }
.pbtn::after { content: "+"; font-family: var(--mono); color: var(--faint) }
.pbtn[aria-expanded="true"]::after { content: "−"; color: var(--accent) }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.st::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 2px }
td .pj { display: block; font-weight: 600; font-size: 15px }
td .fv { display: block; font-size: 11.5px; color: var(--muted) }
td .fv b { color: var(--accent); font-weight: 600 }
.q { color: var(--warn); font-size: 12px }
tr.x td { background: var(--raise); white-space: normal; text-align: left; font-family: var(--body) }
.ladders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px }
.lad { display: grid; gap: 3px; align-content: start; min-width: 0 }
.lad h4 { display: grid; gap: 1px }
.lad h4 span { font-family: var(--mono); font-size: 11.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted) }
.rung { display: grid; grid-template-columns: 34px minmax(0, 1fr) 38px; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted) }
.rung .b { height: 8px; border-radius: 2px; background: var(--panel); overflow: hidden }
.rung .b i { display: block; height: 100%; background: var(--faint); border-radius: 2px }
.rung.safe { color: var(--ink) } .rung.safe .b i { background: var(--muted) }
.rung.is-fav { color: var(--accent); font-weight: 600 } .rung.is-fav .b i { background: var(--accent) }
.rung span:last-child { text-align: right }
svg.tape { width: 96px; height: 26px; vertical-align: middle; overflow: visible }
svg.spark { width: 78px; height: 22px; vertical-align: middle; overflow: visible }
svg.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5 }
svg.spark circle { fill: var(--accent) }

/* tickets */
.tk { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line) }
.tk:first-of-type { border-top: 0 }
.tk .tl { display: flex; justify-content: space-between; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1 }
.tk ul { margin: 0; padding-left: 18px; font-size: 14px }
.band { font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--muted); margin-top: 10px }

/* kpis and bars */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; align-content: start }
.kpi .v { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.kpi p { font-size: 13px; color: var(--muted) }
.bars { display: grid; gap: 8px }
.bar-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px }
.bar-row .track { height: 8px; background: var(--raise); border-radius: 3px; position: relative; overflow: hidden }
.bar-row .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px }
.stackbar { display: flex; height: 20px; border-radius: 4px; overflow: hidden }
.stackbar span { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.won { color: var(--good); font-weight: 600 } .lost { color: var(--bad); font-weight: 600 }

/* last night */
.rv { display: grid; gap: 14px }
.rv-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px }
.rv-score { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .03em }
.rv-score .w { color: var(--ink) } .rv-score .ls { color: var(--muted) }
.verdict { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .1em; padding: 2px 10px; border-radius: 4px; text-transform: uppercase }
.verdict.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good) }
.verdict.no { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad) }
.rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px }
.rv-grid > * { min-width: 0 }
.story { margin: 0; padding-left: 18px; display: grid; gap: 4px }
details { border-top: 1px solid var(--line); padding-top: 10px }
summary { cursor: pointer; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--muted) }
summary:hover { color: var(--ink) }
details[open] summary { margin-bottom: 8px; color: var(--ink) }

/* trends */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.fbtn { border: 1px solid var(--line); background: var(--panel); padding: 4px 12px; border-radius: 999px; cursor: pointer; font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; color: var(--muted) }
.fbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px }
.wl { display: inline-flex; gap: 2px; align-items: flex-end; height: 22px; vertical-align: middle }
.wl i { display: block; width: 5px; border-radius: 1px; background: var(--faint) }
.wl i.w { background: var(--good) } .wl i.lo { background: var(--bad) }
.abs { display: grid; gap: 10px }
.abs-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px }
.abs-h .nm { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase }
.carry { display: grid; gap: 8px }
.steps { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: s }
.steps li { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); counter-increment: s }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--accent) }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.param { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px }
.param .v { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05 }
.param p { font-size: 13px; color: var(--muted) }
.vt { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase }
.vt.yes { color: var(--good) } .vt.no { color: var(--bad) } .vt.ctx { color: var(--warn) }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px }

@media (max-width: 1020px) {
  .desk { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; display: flex; max-height: none; overflow-x: auto; overflow-y: visible; padding-bottom: 4px }
  .rg { flex: 0 0 210px }
  .favs { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .ladders { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 900px) {
  .podium, .windows, .two, .three, .split, .boxes, .rv-grid { grid-template-columns: minmax(0, 1fr) }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 480px) {
  .brand h1 { font-size: 23px } h2 { font-size: 28px }
  .sb-pts { font-size: 56px } .pod .pct { font-size: 60px }
  .kpis { grid-template-columns: minmax(0, 1fr) }
  .favs, .ladders { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) {
  .wp i, .wbar i, .meter i, .rung .b i { transition: width .45s ease-out }
}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="var(--line2)" stroke-width="1.5"/><path d="M1 22a16 16 0 0 1 32 0" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M11 33V23h12v10" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="17" cy="23" r="4" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>
      <div><h1>NBA <em>Quant</em> Desk</h1><div class="when" id="brandSub"></div></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-tonight" data-view="tonight">Tonight</button>
      <button class="tab" role="tab" id="tab-review" data-view="review">Last night</button>
      <button class="tab" role="tab" id="tab-trends" data-view="trends">Trends</button>
      <button class="tab" role="tab" id="tab-record" data-view="record">Record</button>
      <button class="tab" role="tab" id="tab-model" data-view="model">Model</button>
    </nav>
  </div>
</header>

<main><div class="wrap">
  <section class="view" id="view-tonight" role="tabpanel" aria-labelledby="tab-tonight"></section>
  <section class="view" id="view-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
  <section class="view" id="view-trends" role="tabpanel" aria-labelledby="tab-trends" hidden></section>
  <section class="view" id="view-record" role="tabpanel" aria-labelledby="tab-record" hidden></section>
  <section class="view" id="view-model" role="tabpanel" aria-labelledby="tab-model" hidden></section>
  <p class="foot" id="foot"></p>
</div></main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const D = window.NBA;
  const $ = id => document.getElementById(id);
  if (!D) { $("view-tonight").innerHTML = '<div class="panel"><h3>Model data not found</h3><p class="muted">This page reads data.js, which the app writes after every run.</p></div>'; return; }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (x, d) => (100 * x).toFixed(d == null ? 1 : d) + "%";
  const f1 = x => x == null ? "–" : Number(x).toFixed(1);
  const am = x => { x = Math.round(x); return x > 0 ? "+" + x : String(x).replace("-", "−"); };
  const sgn = (x, d) => { const v = Number(x).toFixed(d == null ? 1 : d); return (x > 0 ? "+" : x < 0 ? "−" : "") + v.replace("-", ""); };
  const line = x => x > 0 ? "+" + x : x < 0 ? "−" + Math.abs(x) : "PK";
  const games = D.games || [];
  $("brandSub").textContent = D.meta.slateLabel;

  // ---------- season-bank flags -> chips ----------
  function chip(flag) {
    const f = flag.toLowerCase(); let cls = "", t = "";
    if (f.indexOf("minutes rising") === 0) { t = "Minutes ↑"; cls = "up"; }
    else if (f.indexOf("minutes falling") === 0) { t = "Minutes ↓"; cls = "down"; }
    else if (f.indexOf("breakout") === 0) { t = "Breakout"; cls = "up"; }
    else if (f.indexOf("bigger role") === 0) { t = "Bigger role"; cls = "up"; }
    else if (f.indexOf("more minutes tonight") === 0) { t = "More minutes tonight"; cls = "up"; }
    else if (f.indexOf("hot") === 0 || f.indexOf("scoring up") === 0) { t = "Hot"; cls = "up"; }
    else if (f.indexOf("scoring down") === 0) { t = "Cooling"; cls = "down"; }
    else if (f.indexOf("first nba season") === 0) { t = "Rookie producing"; cls = "up"; }
    else if (f.indexOf("moved into the starting") === 0) { t = "New starter"; cls = "up"; }
    else if (f.indexOf("moved to the bench") === 0) { t = "To bench"; cls = "down"; }
    else if (f.indexOf("steady scorer") === 0) { t = "Steady"; }
    else return "";
    return `<span class="chip ${cls}" title="${esc(flag)}">${esc(t)}</span>`;
  }
  function biasChip(b, n) {
    if (b == null || n < 3 || Math.abs(b) < 2) return "";
    return b < 0 ? `<span class="chip up" title="Model projection minus actual points, average over ${n} games">Model low by ${Math.abs(b).toFixed(1)}</span>`
                 : `<span class="chip down" title="Model projection minus actual points, average over ${n} games">Model high by ${b.toFixed(1)}</span>`;
  }
  function chips(p) {
    const seen = {}, out = [];
    (p.flags || []).forEach(fl => { const c = chip(fl); if (c && !seen[c]) { seen[c] = 1; out.push(c); } });
    const b = biasChip(p.bias, p.biasN); if (b) out.push(b);
    return out.length ? `<div class="chips">${out.join("")}</div>` : "";
  }

  // ---------- upset-risk tiers (favorite's win chance; season record per tier from the walk-forward backtest) ----------
  const TIERS = [
    { lo: .75, key: "strong", label: "Strong", range: "75%+" },
    { lo: .65, key: "solid", label: "Solid", range: "65–75%" },
    { lo: .55, key: "upset", label: "Upset zone", range: "55–65%" },
    { lo: 0, key: "coin", label: "Coin flip", range: "under 55%" }
  ];
  const favP = g => Math.max(g.winHome, 1 - g.winHome);
  const tierOf = p => { for (let i = 0; i < TIERS.length; i++) if (p >= TIERS[i].lo) return i; return TIERS.length - 1; };
  function tierChip(p) {
    const i = tierOf(p), t = TIERS[i], b = D.tiers && D.tiers.bands[i];
    const tip = b && b.n ? ` title="Favorites at ${t.range} this season: ${b.won} of ${b.n} won (${f1(b.exp)} expected)"` : "";
    return `<span class="tier t-${t.key}"${tip}>${t.label}</span>`;
  }
  const valueSpan = ev => ev == null ? "–" : `<span class="${ev >= 0 ? "good" : "bad"}">${sgn(100 * ev)}%</span>`;

  // ---------- the calls: top 3 safest (D.safest keeps tipped games at their last pre-tip numbers) ----------
  function repLine(p) {
    if (!p.pricedAt) return p.report ? "From " + esc(p.report) : "";
    if (!p.report) return "Priced " + esc(p.pricedAt) + " on ESPN injury news (official report not out yet)";
    const m = /(\d{1,2}:\d{2} [AP]M) ET/.exec(p.report);
    return "Priced " + esc(p.pricedAt) + " on the " + (m ? m[1] + " injury report" : esc(p.report)) + (p.complete ? "" : " (not every team had submitted)");
  }
  function statusChip(p) {
    if (p.status === "locked") return '<span class="chip" title="Tipped: these are its numbers from the last run before tip-off">Locked at tip</span>';
    if (p.status === "final") return '<span class="chip up" title="Priced on the injury report just before tip-off">Final</span>';
    if (p.repriceAt) return `<span class="chip warn" title="Reprices on the newest injury report about 25 minutes before tip-off">Updates ${esc(p.repriceAt)}</span>`;
    return "";
  }
  function pod(p, i) {
    const safe = p.p >= .7;
    return `<article class="pod${safe ? " safe" : ""}"><span class="rank" aria-hidden="true">${i + 1}</span>
      <div class="who"><span class="team">${esc(p.team)}</span><span class="muted">${esc(p.at)} ${esc(p.opp)} · ${esc(p.tip)}</span></div>
      <div class="pct">${pct(p.p)}</div>
      <div class="row">${tierChip(p.p)}${safe ? '<span class="chip up" title="70%+ favorite: fine for a moneyline parlay">Parlay OK</span>' : '<span class="chip warn" title="Favorites under 70% have lost far more often this season">Under 70%: not safe</span>'}${statusChip(p)}</div>
      <div class="row small muted"><span>DraftKings <b class="num" style="color:var(--ink)">${p.ml ? am(p.ml) : "–"}</b></span><span>value <b class="num">${valueSpan(p.ev)}</b></span></div>
      <div class="tiny muted">${repLine(p)}</div>
      ${p.ticket ? `<div class="ptk small muted" style="border-top:1px dashed var(--line2);padding-top:8px">Safest four legs: <b style="color:var(--ink)">${esc(p.ticket.legs.join(" + "))}</b> · ${pct(p.ticket.joint, 0)} (fair ${am(p.ticket.fair)})</div>` : ""}
    </article>`;
  }
  function pickTable(picks) {
    if (!picks.length) return '<p class="muted">No games in this window.</p>';
    return `<div class="tscroll"><table><thead><tr><th>#</th><th class="l">Pick</th><th>Win</th><th>Tier</th><th>DK</th><th class="l">Status</th></tr></thead><tbody>${picks.map((p, i) =>
      `<tr><td>${i + 1}</td><td class="l"><b>${esc(p.team)}</b> ${esc(p.at)} ${esc(p.opp)} <span class="muted">${esc(p.tip)}</span></td><td><b class="${p.p >= .7 ? "acc" : ""}">${pct(p.p)}</b></td><td>${tierChip(p.p)}</td><td>${p.ml ? am(p.ml) : "–"}</td><td class="l">${statusChip(p)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  function podium() {
    const S = D.safest;
    let top = S && S.overall && S.overall.length ? S.overall : games.map(g => { const home = g.winHome >= .5; return { team: home ? g.home : g.away, opp: home ? g.away : g.home, at: home ? "vs" : "@", tip: g.tip, p: favP(g), ml: home ? g.dk.mlHome : g.dk.mlAway, ev: home ? g.evHome : g.evAway }; }).sort((a, b) => b.p - a.p).slice(0, 3);
    if (!top.length) return "";
    const r = S && S.record, recs = [];
    if (r && r.top3.n) recs.push(`top-3 picks won <b style="color:var(--ink)">${r.top3.hits} of ${r.top3.n}</b> (${pct(r.top3.pred, 0)} stated)`);
    if (r && r.fav70.n) recs.push(`70%+ favorites <b style="color:var(--ink)">${r.fav70.hits} of ${r.fav70.n}</b>`);
    if (r && r.four.n) recs.push(`safest four-leg tickets <b style="color:var(--ink)">${r.four.hits} of ${r.four.n}</b> (${pct(r.four.pred, 0)} stated)`);
    let h = `<section class="stack" aria-label="Top 3 safest"><div class="win-h"><h3>The three strongest calls${S ? " · " + (S.overallFinal ? '<span class="good">final</span>' : '<span class="warnc">still updating</span>') : ""}</h3>
      <span class="small muted">${recs.length ? "Live record: " + recs.join(", ") + "." : ""}</span></div>
      <div class="podium">${top.map(pod).join("")}</div>`;
    if (S && S.windows && S.windows.length)
      h += `<div class="windows">${S.windows.map(w => `<div class="panel"><div class="win-h"><span class="eyebrow">${esc(w.label)} · ${esc(w.range)} · ${w.games} ${w.games === 1 ? "game" : "games"}</span>${w.final ? '<span class="chip up">Final</span>' : '<span class="chip warn">Updating</span>'}</div>${pickTable(w.picks)}</div>`).join("")}</div>`;
    return h + "</section>";
  }

  // every game still to tip, ranked by the model's win chance
  function callSheet() {
    if (!games.length) return "";
    const rows = games.map(g => {
      const home = g.winHome >= .5;
      return { team: home ? g.home : g.away, opp: home ? g.away : g.home, at: home ? "vs" : "@", tip: g.tip, p: favP(g), ml: home ? g.dk.mlHome : g.dk.mlAway,
        mkt: home ? g.marketWinHome : 1 - g.marketWinHome, ev: home ? g.evHome : g.evAway, dogEv: home ? g.evAway : g.evHome, dog: home ? g.away : g.home, dogMl: home ? g.dk.mlAway : g.dk.mlHome, blow: g.pBlowout };
    }).sort((a, b) => b.p - a.p);
    const ir = D.meta.injuryReport ? esc(D.meta.injuryReport.replace(/\.\s*$/, "")) : "latest injury news (official report not read on this run)";
    return `<div class="panel"><span class="eyebrow">Call sheet</span><h3>Every moneyline, ranked</h3>
      <p class="muted small" style="margin:4px 0 10px">Built <b style="color:var(--ink)">${esc(D.meta.built)}</b> on the ${ir}. Each game reruns about 25 minutes before its tip-off, then drops off this list.</p>
      <div class="tscroll"><table><thead><tr><th>#</th><th class="l">Pick</th><th>Win</th><th></th><th>Tier</th><th title="DraftKings moneyline">DK</th><th title="DraftKings' win chance with the vig removed">DK chance</th><th title="Expected value per $1 at the DraftKings price">Value</th><th title="Chance the game is decided by 20 or more">Blowout</th></tr></thead><tbody>${rows.map((r, i) => {
        const dog = r.dogMl && r.dogEv >= 0.05 ? ` <span class="chip warn" title="The model gives ${esc(r.dog)} enough of a chance that ${am(r.dogMl)} pays more than it costs. Sides like this are unproven: see Model vs DraftKings.">${esc(r.dog)} ${am(r.dogMl)} value?</span>` : "";
        return `<tr><td>${i + 1}</td><td class="l"><b>${esc(r.team)}</b> ${r.at} ${esc(r.opp)} <span class="muted">${esc(r.tip)}</span>${dog}</td><td><b class="${r.p >= .7 ? "acc" : ""}">${pct(r.p)}</b></td>
          <td><span class="meter${r.p >= .7 ? " call" : ""}"><i style="width:${(100 * r.p).toFixed(0)}%"></i></span></td><td>${tierChip(r.p)}</td>
          <td>${r.ml ? am(r.ml) : "–"}</td><td>${r.ml ? pct(r.mkt) : "–"}</td><td>${r.ml ? valueSpan(r.ev) : "–"}</td><td class="${r.blow >= .4 ? "warnc" : ""}">${pct(r.blow, 0)}</td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="tiny muted" style="margin-top:8px">Blue = 70% or better, the only picks to put in a moneyline parlay. A blowout chance of 40% or more means starters may sit the fourth quarter, which hurts player legs.</p></div>`;
  }

  function bestBoost() {
    const b = D.bestSgp; if (!b) return "";
    return `<div class="panel"><span class="eyebrow">Best $5 boost parlay · ${esc(b.game)}</span>
      <ul class="legs">${b.sgp.legs.map((l, i) => `<li><span>${esc(l)}</span><span class="num muted">${pct(b.sgp.legP[i], 0)}</span></li>`).join("")}</ul>
      <div class="kv"><div><span class="eyebrow">Hits</span><span class="v">${pct(b.sgp.joint)}</span></div><div><span class="eyebrow">Fair odds</span><span class="v">${am(b.sgp.fair)}</span></div><div><span class="eyebrow">Take at</span><span class="v">+300 or longer</span></div></div>
      <p class="tiny muted" style="margin-top:8px">Legs are priced together from the same simulated games (${b.sgp.lift.toFixed(2)}× the chance of independent legs).</p></div>`;
  }

  function vsVegas() {
    const edges = [];
    games.forEach(g => [{ t: g.away, p: 1 - g.winHome, ml: g.dk.mlAway, ev: g.evAway, mkt: 1 - g.marketWinHome }, { t: g.home, p: g.winHome, ml: g.dk.mlHome, ev: g.evHome, mkt: g.marketWinHome }].forEach(s => { if (s.ml && s.ev >= 0.05) edges.push(s); }));
    edges.sort((a, b) => b.ev - a.ev);
    const bt = D.tiers && D.tiers.edges;
    return `<div class="panel"><span class="eyebrow">Model vs DraftKings</span>
      <div class="call-h">${edges.length ? edges.length + (edges.length === 1 ? " side" : " sides") + " the model rates higher" : "The model agrees with DraftKings tonight"}</div>
      ${edges.length ? `<ul class="legs">${edges.map(s => `<li><span>${esc(s.t)} ${am(s.ml)} <span class="muted">model ${pct(s.p, 0)} · DK ${pct(s.mkt, 0)}</span></span><span class="num">${sgn(100 * s.ev)}%</span></li>`).join("")}</ul>` : ""}
      <p class="small muted" style="margin-top:8px">DraftKings never feeds the simulation; this is only a comparison.${bt && bt.n ? ` Sides like these in the season backtest won <b style="color:var(--ink)">${bt.won} of ${bt.n}</b> (${f1(bt.exp)} expected), <b class="${bt.units >= 0 ? "good" : "bad"}">${sgn(bt.units)} units</b> at $1 a bet.` : ""} Treat them as unproven.</p></div>`;
  }

  function upsetWatch() {
    const rows = TIERS.map((t, i) => {
      const tonight = games.filter(g => tierOf(favP(g)) === i).map(g => (g.winHome >= .5 ? g.home : g.away) + " " + pct(favP(g), 0));
      const b = D.tiers && D.tiers.bands[i];
      return `<tr><td class="l">${tierChip(t.lo || .5)} <span class="muted">${t.range}</span></td><td class="l">${tonight.length ? esc(tonight.join(", ")) : '<span class="muted">none</span>'}</td><td>${b && b.n ? b.won + " of " + b.n : "–"}</td><td>${b && b.n ? f1(b.exp) : "–"}</td></tr>`;
    }).join("");
    const pr = D.tiers && D.tiers.parlay;
    return `<div class="panel"><span class="eyebrow">Upset watch</span><h3>How shaky each favorite is</h3>
      <p class="small muted" style="margin:4px 0 10px">Season record from every game since opening night, each priced before tip-off with earlier games only. A 60% favorite still loses 4 times in 10.</p>
      <div class="tscroll"><table><thead><tr><th class="l">Tier</th><th class="l">Tonight</th><th>Won this season</th><th>Expected</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${pr && pr.n ? `<p class="small muted" style="margin-top:10px">Favorites at 70% or better have won <b style="color:var(--ink)">${pr.won} of ${pr.n}</b> (${f1(pr.exp)} expected).</p>` : ""}</div>`;
  }

  // banned teams: left out of every simulation, pick and parlay; tracked as information only
  function bannedPanel() {
    const B = D.banned; if (!B || !B.teams || !B.teams.length) return "";
    const roll = r => !r || !r.n ? '<span class="muted">no games yet</span>' :
      `<b>${r.w}–${r.l}</b> · ATS ${r.atsW}–${r.atsL}${r.atsP ? "–" + r.atsP : ""} · margin ${sgn(r.margin)} · ${sgn(r.vsLine)} vs the DraftKings spread · ${r.w} wins vs ${f1(r.expW)} DraftKings expected`;
    const rows = B.teams.map(t => {
      const gs = (B.tonight || []).filter(g => (" " + g + " ").indexOf(" " + t.team + " ") >= 0);
      const recent = (t.recent || []).map(g => { const m = g.pts - g.oppPts, cov = g.spread == null ? "" : (m + g.spread > 0 ? ", covered" : m + g.spread < 0 ? ", no cover" : ", push");
        return esc(g.date.slice(5)) + " " + g.where + " " + esc(g.opp) + " " + g.pts + "–" + g.oppPts + " " + (m > 0 ? "W" : "L") + (g.spread == null ? "" : " (DK " + line(g.spread) + cov + ")"); }).join(" · ");
      return `<div style="margin-top:10px"><b>${esc(t.team)}</b> <span class="chip down">Banned since ${esc(t.since)}</span>${t.reason ? ` <span class="muted small">${esc(t.reason)}</span>` : ""}
        ${gs.length ? `<div class="small muted" style="margin-top:4px">Left out tonight: <b style="color:var(--ink)">${gs.map(esc).join(", ")}</b></div>` : ""}
        <div class="small" style="margin-top:4px">Season: ${roll(t.season)}</div><div class="small">Last 10: ${roll(t.last10)}</div><div class="small">Since the ban: ${roll(t.sinceBan)}</div>
        ${t.model ? `<div class="tiny muted">Model on ${esc(t.team)} games before the ban: picked the winner in ${t.model.right} of ${t.model.n}</div>` : ""}
        ${recent ? `<div class="tiny muted">Latest: ${recent}</div>` : ""}</div>`;
    }).join("");
    return `<div class="panel"><span class="eyebrow">Banned teams · information only</span><h3>Not simulated, priced or parlayed</h3>
      <p class="small muted" style="margin-top:4px">Their games stay out of every pick, ticket and backtest. Results are still collected so a steady trend shows before a team comes back.</p>${rows}</div>`;
  }

  // ---------- game desk ----------
  let sel = 0;
  function railItem(g, i) {
    const home = g.winHome >= .5, p = favP(g), wa = 1 - g.winHome;
    const b2b = [g.b2bAway ? g.away : "", g.b2bHome ? g.home : ""].filter(Boolean);
    return `<button class="rg" type="button" id="rg-${i}" data-i="${i}" aria-pressed="${i === sel}">
      <span class="top"><span class="eyebrow">${esc(g.tip)}</span>${b2b.length ? `<span class="chip warn" title="Second night of a back-to-back">B2B ${esc(b2b.join(", "))}</span>` : ""}</span>
      <span class="top"><span class="mu">${esc(g.away)} <span>@</span> ${esc(g.home)}</span><span class="pk${p >= .7 ? " acc" : ""}">${esc(home ? g.home : g.away)} ${pct(p, 0)}</span></span>
      <span class="wbar" aria-hidden="true"><i class="${home ? "" : "call"}" style="width:${(100 * wa).toFixed(1)}%"></i><i class="${home ? "call" : ""}" style="flex:1"></i></span></button>`;
  }

  // the simulated margin as a curve (normal shape from the simulations' average margin and spread)
  function curve(g) {
    const mu = g.margin, sd = g.sdMargin; if (mu == null || !sd) return "";
    const W = 480, H = 132, L = 6, T = 20, B = 24, pw = W - 2 * L, ph = H - T - B;
    const lim = Math.max(30, Math.ceil((Math.abs(mu) + 2.4 * sd) / 10) * 10);
    const x = m => L + (m + lim) / (2 * lim) * pw, f = m => Math.exp(-(m - mu) * (m - mu) / (2 * sd * sd)), y = v => T + (1 - v) * ph;
    const area = (a, b) => { let d = `M${x(a).toFixed(1)},${y(0).toFixed(1)}`; for (let k = 0; k <= 48; k++) { const m = a + (b - a) * k / 48; d += ` L${x(m).toFixed(1)},${y(f(m)).toFixed(1)}`; } return d + ` L${x(b).toFixed(1)},${y(0).toFixed(1)} Z`; };
    const homePick = g.winHome >= .5, dkm = -g.dk.spreadHome;
    let s = `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Simulated margin: average ${mu > 0 ? g.home : g.away} by ${Math.abs(mu).toFixed(1)}, DraftKings line ${g.home} ${line(g.dk.spreadHome)}">`;
    s += `<path d="${area(-lim, 0)}" fill="${homePick ? "var(--faint)" : "var(--accent)"}" fill-opacity=".45"/><path d="${area(0, lim)}" fill="${homePick ? "var(--accent)" : "var(--faint)"}" fill-opacity=".45"/>`;
    s += `<line x1="${L}" x2="${W - L}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)" stroke-width="1"/>`;
    [-20, 0, 20].forEach(m => { s += `<line x1="${x(m)}" x2="${x(m)}" y1="${y(0)}" y2="${y(0) + 4}" stroke="var(--muted)" stroke-width="1"/><text x="${x(m)}" y="${H - 6}" text-anchor="middle">${m === 0 ? "EVEN" : esc(m < 0 ? g.away : g.home) + " +20"}</text>`; });
    s += `<line x1="${x(mu)}" x2="${x(mu)}" y1="${y(1)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
    if (Math.abs(dkm) <= lim) s += `<line x1="${x(dkm)}" x2="${x(dkm)}" y1="${T - 4}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const near = Math.abs(x(mu) - x(dkm)) < 96, left = mu <= dkm;
    s += `<text x="${x(mu)}" y="${T - 8}" text-anchor="${near ? (left ? "end" : "start") : "middle"}" dx="${near ? (left ? -4 : 4) : 0}">model ${sgn(mu)}</text>`;
    if (Math.abs(dkm) <= lim) s += `<text x="${x(dkm)}" y="${T - 8}" text-anchor="${near ? (left ? "start" : "end") : "middle"}" dx="${near ? (left ? 4 : -4) : 0}">DK ${sgn(dkm)}</text>`;
    return s + "</svg>";
  }

  // a player's recent games as bars against a line (bars at or above the line are lit)
  function tape(log, idx, ln) {
    if (!log || log.length < 2) return "";
    const vals = log.map(r => r[idx]), mx = Math.max(ln || 0, Math.max.apply(null, vals), 1), w = 96, h = 26, bw = 6;
    let s = `<svg class="tape" viewBox="0 0 ${w} ${h}" role="img" aria-label="Last ${vals.length} games: ${vals.join(", ")}"><title>Last ${vals.length} games, oldest first: ${vals.join(", ")}</title>`;
    vals.forEach((v, i) => { const bh = Math.max(1.5, v / mx * (h - 3)), xx = w - (vals.length - i) * (bw + 2); s += `<rect x="${xx}" y="${(h - bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="1" fill="${ln && v >= ln ? "var(--accent)" : "var(--faint)"}"/>`; });
    if (ln) { const yy = (h - ln / mx * (h - 3)).toFixed(1); s += `<line x1="${w - vals.length * (bw + 2) - 2}" x2="${w}" y1="${yy}" y2="${yy}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>`; }
    return s + "</svg>";
  }

  const STATS = [["PTS", "pts", 1], ["REB", "reb", 2], ["AST", "ast", 3], ["3PM", "tpm", 4]];
  function statCell(p, key, field) {
    const f = p.fav && p.fav[key];
    return `<td><span class="pj">${f1(p[field])}</span>${f ? `<span class="fv" title="Favorite line ${f[0]}+: ${pct(f[1])} tonight. Reached in ${f[2]} of ${f[3]} games this season, ${f[4]} of the last ${f[5]}.">${f[0]}+ <b>${pct(f[1], 0)}</b></span>` : '<span class="fv">–</span>'}</td>`;
  }
  function ladder(p, key, field) {
    const lad = (p.lad && p.lad[key]) || [], f = p.fav && p.fav[key];
    const ctx = ["proj " + f1(p[field])]; if (p.season) ctx.push((p.season.prior ? "last season " : "season ") + f1(p.season[field])); if (p.l5) ctx.push("last " + p.l5.n + " " + f1(p.l5[field]));
    return `<div class="lad"><h4>${key} <span>${ctx.join(" · ")}</span></h4>${lad.map(r => `<div class="rung${f && r[0] === f[0] ? " is-fav" : r[1] >= .85 ? " safe" : ""}"><span>${r[0]}+</span><span class="b"><i style="width:${(100 * r[1]).toFixed(0)}%"></i></span><span>${pct(r[1], 0)}</span></div>`).join("") || '<span class="tiny muted">No rung reaches 2%.</span>'}
      <span class="tiny muted">${f ? `Favorite ${f[0]}+: reached in ${f[2]} of ${f[3]} this season, ${f[4]} of the last ${f[5]}.` : "No line reaches " + pct((D.favRecord && D.favRecord.min) || .6, 0) + "."}</span></div>`;
  }
  function boxTable(g, home, gi) {
    const rows = (home ? g.boxHome : g.boxAway).filter(p => p.min >= 9.5), team = home ? g.home : g.away, tt = home ? g.teamHome : g.teamAway;
    const sum = f => (home ? g.boxHome : g.boxAway).reduce((s, p) => s + p[f] * p.play, 0);
    let h = `<div><div class="team-cap"><span class="ab${(g.winHome >= .5) === home ? " acc" : ""}">${esc(team)}</span><span class="eyebrow">${esc(home ? g.homeName : g.awayName)}</span></div>
      <div class="tscroll"><table><thead><tr><th class="l">Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th><th title="Points in his last games, oldest first. The dashed line is his favorite points line.">Recent pts</th></tr></thead><tbody>`;
    rows.forEach((p, k) => {
      const id = `x-${gi}-${home ? "h" : "a"}-${k}`, q = p.play < 0.95 ? ` <span class="q" title="Plays in ${pct(p.play, 0)} of simulations">plays ${pct(p.play, 0)}</span>` : "";
      const notes = [];
      if (p.learnPts && Math.abs(p.learnPts - 1) >= .01) notes.push(`scoring rate ${sgn(100 * (p.learnPts - 1), 0)}% from his results against the model's projections`);
      if (p.learnAst && Math.abs(p.learnAst - 1) >= .01) notes.push(`assist rate ${sgn(100 * (p.learnAst - 1), 0)}%`);
      if (p.minTrend && Math.abs(p.minTrend) >= .3) notes.push(`minutes ${sgn(p.minTrend)} from his last three games`);
      h += `<tr><td class="pl"><button class="pbtn${p.starter ? " st" : ""}" type="button" aria-expanded="false" aria-controls="${id}" title="${p.starter ? "Projected starter. " : ""}Open his ladders">${esc(p.name)}</button>${q}${chips(p)}</td>
        <td><span class="pj">${f1(p.min)}</span>${p.minTrend && Math.abs(p.minTrend) >= .5 ? `<span class="fv ${p.minTrend > 0 ? "good" : "bad"}" title="Shift from his last three games">${sgn(p.minTrend)}</span>` : ""}</td>
        ${STATS.map(s => statCell(p, s[0], s[1])).join("")}<td>${tape(p.log, 1, p.fav && p.fav.PTS ? p.fav.PTS[0] : 0)}</td></tr>
        <tr class="x" id="${id}" hidden><td colspan="7"><div class="ladders">${STATS.map(s => ladder(p, s[0], s[1])).join("")}</div>
        <p class="tiny muted" style="margin-top:8px;max-width:none">Points range ${p.ptsLo}–${p.ptsHi} (10th to 90th percentile) · points + rebounds + assists ${f1(p.pra)} · double-double ${pct(p.dd, 0)}${notes.length ? " · Trend learning: " + notes.join(", ") + "." : ""}</p></td></tr>`;
    });
    h += `<tr class="tot"><td class="l">Team</td><td>240</td><td>${f1(tt.pts)}</td><td>${f1(sum("reb"))}</td><td>${f1(tt.ast)}</td><td>${f1(sum("tpm"))}</td><td></td></tr>`;
    return h + "</tbody></table></div></div>";
  }
  function ticket(c) {
    return `<div class="tk"><div class="tl"><span>${pct(c.joint)}</span><span class="num muted" style="font-size:14px">fair ${am(c.fair)}</span></div><ul>${c.legs.map((l, i) => `<li>${esc(l)} <span class="muted num">${pct(c.legP[i], 0)}</span></li>`).join("")}</ul></div>`;
  }
  function sheet(g, gi) {
    if (!g) return "";
    const wa = 1 - g.winHome, kA = 1 - g.marketWinHome, homePick = g.winHome >= .5;
    const outA = g.outAway.length ? g.outAway.join(", ") : "none", outH = g.outHome.length ? g.outHome.join(", ") : "none", q = g.qAway.concat(g.qHome);
    const favs = g.favs || [];
    return `<div class="panel stack">
        <div class="win-h"><span class="eyebrow">${esc(g.tip)} · projected final, average of ${D.meta.sims.toLocaleString()} simulated games</span><span>${tierChip(favP(g))}${favP(g) >= .7 ? ' <span class="chip up">Parlay OK</span>' : ""}</span></div>
        <div class="scorebug"><div class="sb-side${homePick ? "" : " call"}"><span class="sb-abbr">${esc(g.away)}</span><span class="sb-name">${esc(g.awayName)}</span><span class="sb-pts">${f1(g.ptsAway)}</span></div>
          <span class="sb-mid">at</span>
          <div class="sb-side h${homePick ? " call" : ""}"><span class="sb-abbr">${esc(g.home)}</span><span class="sb-name">${esc(g.homeName)}</span><span class="sb-pts">${f1(g.ptsHome)}</span></div></div>
        <div><div class="wp-labels"><span class="${homePick ? "" : "acc"}">${pct(wa)}</span><span class="${homePick ? "acc" : ""}">${pct(g.winHome)}</span></div>
          <div class="wp" role="img" aria-label="Win chance: ${esc(g.away)} ${pct(wa)}, ${esc(g.home)} ${pct(g.winHome)}. DraftKings: ${esc(g.away)} ${pct(kA)}"><i class="${homePick ? "" : "call"}" style="width:${(100 * wa).toFixed(1)}%"></i><i class="${homePick ? "call" : ""}"></i><span class="tick" style="left:${(100 * kA).toFixed(1)}%" title="DraftKings win chance, vig removed"></span></div>
          <div class="tiny muted" style="margin-top:6px">Dashed mark: DraftKings has ${esc(g.marketWinHome >= .5 ? g.home : g.away)} at ${pct(Math.max(g.marketWinHome, kA))}.</div></div>
        ${curve(g)}
        <dl class="facts">
          <div><dt>DraftKings spread</dt><dd>${esc(g.home)} ${line(g.dk.spreadHome)}</dd></div>
          <div><dt>DraftKings moneyline</dt><dd>${esc(g.away)} ${am(g.dk.mlAway)} · ${esc(g.home)} ${am(g.dk.mlHome)}</dd></div>
          <div><dt>Total: model vs DraftKings</dt><dd>${f1(g.total)} vs ${g.dk.total}</dd></div>
          <div><dt>Over ${g.dk.total}</dt><dd>${pct(g.pOver)}</dd></div>
          <div><dt>Decided by 20+</dt><dd class="${g.pBlowout >= .4 ? "warnc" : ""}">${pct(g.pBlowout)}</dd></div>
          <div><dt>Within 5 points</dt><dd>${pct(g.pClose)}</dd></div>
          <div><dt>Overtime</dt><dd>${pct(g.pOT)}</dd></div>
          <div><dt>Value at DraftKings</dt><dd>${esc(g.away)} ${valueSpan(g.evAway)} · ${esc(g.home)} ${valueSpan(g.evHome)}</dd></div>
        </dl>
        <p class="small muted" style="max-width:none"><b style="color:var(--ink)">Out:</b> ${esc(g.away + ": " + outA + "; " + g.home + ": " + outH)}${q.length ? ` · <b style="color:var(--ink)">Questionable:</b> ${esc(q.join(", "))}` : ""}</p>
      </div>
      ${favs.length ? `<div class="panel stack"><div><span class="eyebrow">The model's favorite lines</span><h3>${esc(g.away)} @ ${esc(g.home)}: the biggest lines the simulations still back</h3>
        <p class="small muted" style="margin-top:4px">A favorite is the highest line a player clears in at least ${pct((D.favRecord && D.favRecord.min) || .6, 0)} of the games he plays: not his safest line and not a single most-likely number. These are the largest ones among tonight's main players. Every player's favorite for each stat is in the box score below.</p></div>
        <div class="favs">${favs.map(f => `<div class="fav"><span class="nm" title="${esc(f.name)}">${esc(f.name)} <span class="muted">${esc(f.team)}</span></span><span class="ln">${f.line}+ ${esc(f.unit)} <span>${pct(f.p, 0)}</span></span><span class="meter call"><i style="width:${(100 * f.p).toFixed(0)}%"></i></span>
          <span class="tiny muted">Season ${f.hit} of ${f.gp} · last ${f.l5n}: ${f.l5hit} · averages ${f1(f.avg)}</span><span class="tiny muted">${f.reach > 0 ? "Next rung " + f.reach + "+ at " + pct(f.pReach, 0) : "Top rung"} · projected ${f1(f.mean)}</span></div>`).join("")}</div></div>` : ""}
      <div class="panel stack"><div><span class="eyebrow">Model box score</span><h3>Projection and favorite line for every stat</h3>
        <p class="small muted" style="margin-top:4px;max-width:none">Top number: the average across the simulations he plays in, so the lines add up to the team score. Under it: his favorite line and its chance. Open a player for the full ladder. Dot = projected starter.</p></div>
        <div class="boxes">${boxTable(g, false, gi)}${boxTable(g, true, gi)}</div></div>
      <div class="two"><div class="panel"><span class="eyebrow">Four-leg tickets</span>${["safest", "boost", "bigger"].map(k => `<div class="band">${{ safest: "Safest", boost: "Boost range (about +285)", bigger: "Bigger payout (about +620)" }[k]}</div>${g.four[k].length ? g.four[k].map(ticket).join("") : '<p class="muted small">No ticket in this band.</p>'}`).join("")}</div>
        <div class="panel"><span class="eyebrow">Boost parlays, three legs</span><p class="small muted" style="margin-top:4px">With the 50% profit boost, a ticket priced +300 or longer needs 18.2% to break even.</p>${(g.boost || []).map(ticket).join("") || '<p class="muted small">None priced.</p>'}</div></div>`;
  }

  function eruptDud() {
    if (!D.erupt || !D.dud || (!D.erupt.length && !D.dud.length)) return "";
    const rows = (list, erupt) => list.map(p => `<tr><td class="pl"><b>${esc(p.name)}</b> <span class="muted">${esc(p.team)} vs ${esc(p.opp)}</span>${chips({ flags: p.flags, bias: p.bias, biasN: p.biasN })}</td>
      <td>${f1(p.season)}</td><td>${f1(p.proj)}</td><td>${p.fav != null ? p.fav + "+ <span class=\"muted\">" + pct(p.favP, 0) + "</span>" : "–"}</td><td>${erupt ? p.line + "+" : "≤ " + p.line}</td><td><b class="${erupt ? "good" : "bad"}">${pct(p.p, 0)}</b></td>
      <td><span class="chip ${p.check === "bank agrees" ? "up" : p.check === "bank disagrees" ? "down" : p.check === "mixed" ? "warn" : ""}">${esc(p.check || "no signal")}</span></td><td title="Season minutes → tonight">${f1(p.seasonMin)} → ${f1(p.min)}</td></tr>`).join("");
    const head = '<thead><tr><th class="l">Player</th><th>Season</th><th>Proj</th><th title="The model\'s favorite points line and its chance">Favorite</th><th>Line</th><th>Chance</th><th title="Does this season\'s data bank back the call?">Bank check</th><th>Minutes</th></tr></thead>';
    return `<div class="head"><h2>Who could erupt, who could be a dud</h2><p class="muted">Against each player's own 2026-27 scoring. Erupt = 1.5× his average or 6 more points, whichever is higher. Dud = half his average or less. Both lists are graded every day.</p></div>
      <div class="two"><div class="panel tscroll"><h3>Could erupt</h3><table>${head}<tbody>${rows(D.erupt, true)}</tbody></table></div><div class="panel tscroll"><h3>Dud risk</h3><table>${head}<tbody>${rows(D.dud, false)}</tbody></table></div></div>`;
  }

  function renderTonight() {
    const m = D.meta, n = games.length, banned = (D.banned && D.banned.tonight) || [];
    let h = `<div class="head"><h2>Tonight · ${n} ${n === 1 ? "game" : "games"} to tip</h2><div class="status">
      <span class="stat-chip">Built <b>${esc(m.built)}</b></span><span class="stat-chip"><b>${m.sims.toLocaleString()}</b> possession-by-possession simulations per game</span>
      <span class="stat-chip">Season bank through <b>${esc(m.bankThrough)}</b> · ${m.bankGames} games</span>${D.learn && (D.learn.minTrend > 0 || D.learn.ptsK > 0 || D.learn.astK > 0) ? `<span class="stat-chip">Trend learning <b>on</b> · ${D.learn.players} players through ${esc(D.learn.through)}</span>` : ""}</div></div>`;
    h += podium();
    if (!n) h += '<div class="panel"><h3>No games left to price</h3><p class="muted">Every game on this slate has tipped or is banned. The three calls above keep their last numbers from before tip-off.</p></div>';
    h += `<div class="split"><div class="stack">${callSheet()}</div><div class="stack">${bestBoost()}${vsVegas()}</div></div>`;
    if (n) h += `<div class="head"><h2>Game desk</h2><p class="muted">Pick a game. Its sheet shows the projected final, how the margin spreads out, the lines the model favors, and every player's ladder.</p></div>
      <div class="desk"><div class="rail" id="rail" role="group" aria-label="Tonight's games">${games.map(railItem).join("")}${banned.map(b => `<div class="rg off"><span class="top"><span class="eyebrow">Banned · information only</span></span><span class="mu" style="font-size:18px">${esc(b)}</span></div>`).join("")}</div>
      <div class="sheet" id="sheet">${sheet(games[sel], sel)}</div></div>`;
    h += eruptDud();
    h += `<div class="two">${upsetWatch()}${bannedPanel()}</div>`;
    const v = $("view-tonight"); v.innerHTML = h;
    v.addEventListener("click", e => {
      const rg = e.target.closest(".rg[data-i]");
      if (rg) {
        sel = +rg.getAttribute("data-i");
        v.querySelectorAll(".rg[data-i]").forEach(x => x.setAttribute("aria-pressed", String(+x.getAttribute("data-i") === sel)));
        $("sheet").innerHTML = sheet(games[sel], sel);
        if (matchMedia("(max-width: 1020px)").matches) $("sheet").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        return;
      }
      const pb = e.target.closest(".pbtn");
      if (pb) { const row = $(pb.getAttribute("aria-controls")), open = pb.getAttribute("aria-expanded") !== "true"; pb.setAttribute("aria-expanded", String(open)); if (row) row.hidden = !open; }
    });
  }

  // ---------- LAST NIGHT ----------
  const mg = (home, away, m) => m > 0 ? `${esc(home)} by ${Math.abs(m)}` : m < 0 ? `${esc(away)} by ${Math.abs(m)}` : "even";
  function reviewGame(g) {
    const homeWon = g.homePts > g.awayPts, ta = g.teams[0], th = g.teams[1];
    const cmp = (label, a, b) => `<tr><td class="l">${label}</td><td>${a}</td><td>${b}</td></tr>`;
    const tp = t => `${t.tpm}-${t.tpa} <span class="muted">(${t.tpa ? pct(t.tpm / t.tpa, 0) : "–"}, season ${pct(t.seasonTp, 0)})</span>`;
    const evs = (g.events || []).filter(e => e.type !== "ejection");
    return `<article class="panel rv">
      <div class="rv-top"><div class="rv-score"><span class="${homeWon ? "ls" : "w"}">${esc(g.away)} ${g.awayPts}</span> <span class="muted" style="font-size:20px">@</span> <span class="${homeWon ? "w" : "ls"}">${esc(g.home)} ${g.homePts}</span>${g.ot ? ' <span class="muted" style="font-size:20px">OT</span>' : ""}</div>
        <div class="pod-row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="verdict ${g.won ? "ok" : "no"}">${g.won ? "Right" : "Wrong"}</span><span class="small muted">Model had <b style="color:var(--ink)">${esc(g.fav)} ${pct(g.p)}</b>${g.dk != null ? " · DraftKings " + pct(g.dk) : ""}</span></div></div>
      <div class="rv-grid"><div class="stack">
          <div class="tscroll"><table><thead><tr><th class="l">Team</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Final</th></tr></thead><tbody>
            <tr><td class="l"><b>${esc(g.away)}</b></td>${g.awayQ.map(q => `<td>${q}</td>`).join("")}<td><b>${g.awayPts}</b></td></tr>
            <tr><td class="l"><b>${esc(g.home)}</b></td>${g.homeQ.map(q => `<td>${q}</td>`).join("")}<td><b>${g.homePts}</b></td></tr></tbody></table></div>
          <div class="tscroll"><table><thead><tr><th class="l">Model vs result</th><th>Model</th><th>DraftKings</th><th>Actual</th></tr></thead><tbody>
            <tr><td class="l">Margin</td><td>${g.marginModel == null ? "–" : mg(g.home, g.away, g.marginModel)}</td><td>${g.marginDk == null ? "–" : mg(g.home, g.away, g.marginDk)}</td><td><b>${mg(g.home, g.away, g.margin)}</b></td></tr>
            <tr><td class="l">Total</td><td>${f1(g.totalModel)}</td><td>${g.totalDk == null ? "–" : g.totalDk}</td><td><b>${g.total}</b></td></tr></tbody></table></div>
          <div class="tscroll"><table><thead><tr><th class="l">In the game</th><th>${esc(ta.team)}</th><th>${esc(th.team)}</th></tr></thead><tbody>
            ${cmp("Threes", tp(ta), tp(th))}${cmp("Free throws", ta.ftm + "-" + ta.fta, th.ftm + "-" + th.fta)}${cmp("Fouls called", ta.pf, th.pf)}${cmp("Turnovers", ta.tov, th.tov)}${cmp("Rebounds", ta.reb, th.reb)}${cmp("Largest lead", ta.lead, th.lead)}${cmp("Technicals", ta.tech, th.tech)}</tbody></table></div>
        </div><div class="stack">
          <div><span class="eyebrow">What happened</span>${g.story.length ? `<ul class="story">${g.story.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : '<p class="muted small">Nothing unusual: no big run, shooting swing or whistle gap.</p>'}</div>
          ${evs.length ? `<div><span class="eyebrow">Flagrants and technicals</span><ul class="story small muted">${evs.map(e => `<li>Q${e.q} ${esc(e.clock)}: ${esc(e.text)}</li>`).join("")}</ul></div>` : ""}
          <div><span class="eyebrow">Player calls</span><p class="small">Calls at 80% or better: <b>${g.hiHit} of ${g.hiN}</b> hit. Calls at 60–80%: <b>${g.midHit} of ${g.midN}</b>.${g.favN ? ` Favorite lines: <b>${g.favHit} of ${g.favN}</b>.` : ""}</p>
            ${g.hiMiss.length ? `<ul class="story small muted">${g.hiMiss.map(m => `<li>Missed at ${pct(m.p, 0)}: ${esc(m.sel)}${m.actual != null ? " (finished with " + m.actual + ")" : ""}</li>`).join("")}</ul>` : ""}</div>
          ${g.favList && g.favList.length ? `<div><span class="eyebrow">Favorite lines</span><ul class="story small">${g.favList.map(f => `<li><span class="${f.hit ? "good" : "bad"}">${f.hit ? "Hit" : "Miss"}</span> ${esc(f.sel)} <span class="muted">${pct(f.p, 0)}${f.actual != null ? " · finished with " + f.actual : ""}</span></li>`).join("")}</ul></div>` : ""}

        </div></div>

  function renderReview() {

  // ---------- TRENDS ----------
  function spark(arr) {
    if (!arr || arr.length < 2) return "";
    const mx = Math.max.apply(null, arr), mn = Math.min.apply(null, arr), w = 78, hh = 22, span = Math.max(1, mx - mn);
    const pts = arr.map((v, i) => (i * (w - 4) / (arr.length - 1) + 2).toFixed(1) + "," + (hh - 3 - (v - mn) / span * (hh - 6)).toFixed(1)), last = pts[pts.length - 1].split(",");
    return `<svg class="spark" viewBox="0 0 ${w} ${hh}" role="img" aria-label="${arr.join(", ")}"><title>${arr.join(", ")}</title><polyline points="${pts.join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5"/></svg>`;
  }
  const wl = ms => `<span class="wl" title="Margin by game, oldest first: ${ms.join(", ")}">${ms.map(m => `<i class="${m > 0 ? "w" : "lo"}" style="height:${(4 + Math.min(18, Math.abs(m) / 30 * 18)).toFixed(0)}px"></i>`).join("")}</span>`;
  const trajChip = t => t === "rising" ? '<span class="chip up">Rising</span>' : t === "falling" ? '<span class="chip down">Falling</span>' : '<span class="chip">Steady</span>';
  const verdictChip = v => `<span class="chip ${v === "worth noticing" ? "call" : v === "leaning" ? "warn" : ""}">${esc(v)}</span>`;
  const STATNAME = { PTS: "Points", MIN: "Minutes", REB: "Rebounds", AST: "Assists", "3PM": "Threes", "TEAM MARGIN": "Team margin" };
  let tFilter = "all", pTeam = "", pAll = false;
  function teamsTable(T) {
    const tonight = {}; games.forEach(g => { tonight[g.away] = 1; tonight[g.home] = 1; });
    const list = T.teams.filter(t => tFilter === "all" || (tFilter === "tonight" ? tonight[t.team] : t.traj === tFilter));
    return `<div class="tscroll"><table><thead><tr><th class="l">Team</th><th>Record</th><th>Run</th><th>Last 5</th><th>Margin</th><th title="Last five games against the games before them">Last 5 / before</th><th class="l">Game by game</th><th class="l">Trend</th><th title="Against the DraftKings spread">ATS</th><th title="Over–under against the DraftKings total">O–U</th><th>Home</th><th>Road</th><th title="As the DraftKings favorite">Fav</th><th title="As the DraftKings underdog">Dog</th><th title="Average first-quarter margin">Q1</th><th title="Average fourth-quarter margin">Q4</th><th title="Games where the model named the winner">Model</th><th class="l">Notes</th></tr></thead><tbody>${list.map(t =>
      `<tr><td class="l"><b>${esc(t.team)}</b>${t.banned ? ' <span class="chip down">Banned</span>' : ""}</td><td>${t.w}–${t.l}</td><td class="${t.streak >= 3 ? "good" : t.streak <= -3 ? "bad" : ""}">${t.streak > 0 ? "W" + t.streak : "L" + (-t.streak)}</td><td>${esc(t.l5)}</td><td>${sgn(t.margin)}</td><td>${sgn(t.l5margin)} / ${t.gp > 5 ? sgn(t.before) : "–"}</td><td class="l">${wl(t.margins)}</td><td class="l">${trajChip(t.traj)}</td><td>${esc(t.ats)}</td><td>${esc(t.ou)}</td><td>${esc(t.home)}</td><td>${esc(t.away)}</td><td>${esc(t.fav)}</td><td>${esc(t.dog)}</td><td>${sgn(t.q1)}</td><td>${sgn(t.q4)}</td><td>${t.modelN ? t.modelRight + "/" + t.modelN : "–"}</td><td class="l small muted" style="min-width:220px">${esc(t.notes.join("; "))}</td></tr>`).join("") || '<tr><td class="l muted" colspan="18">No team fits this filter.</td></tr>'}</tbody></table></div>`;
  }
  function playersTable(T) {

  }
  function renderTrends() {

    v.innerHTML = `<div class="head"><h2>Season trends · through ${esc(T.through)}</h2><p class="muted">${T.games} games this season. Information only: none of this is a prediction. Each section says how much weight the pattern has earned so far.</p></div>
      <div class="kpis">
        <div class="kpi"><span class="eyebrow">Home teams</span><span class="v">${L.homeW}–${L.games - L.homeW}</span><p>${pct(L.homeW / L.games, 0)} won at home</p></div>
        <div class="kpi"><span class="eyebrow">DraftKings favorites</span><span class="v">${L.favW} of ${L.favN}</span><p>won outright · covered the spread ${L.favCover} times</p></div>

      </div>
      <div class="split"><div class="panel"><span class="eyebrow">Is a hot stretch real?</span><h3>How much of the last five games carried into the next one</h3>

          <div class="bars">${T.carry.map(c => `<div class="bar-row"><span>${esc(STATNAME[c.stat] || c.stat)} <span class="muted tiny">${c.n.toLocaleString()} games</span></span><span class="track"><span class="fill" style="width:${Math.max(0, Math.min(100, 100 * c.b)).toFixed(0)}%;background:var(--accent)"></span></span><span class="num" style="text-align:right">${pct(c.b, 0)}</span></div>`).join("")}</div>
          <p class="small muted" style="margin-top:12px">Minutes changes stick${D.learn && D.learn.minTrend > 0 ? ", which is why the model leans a player's minutes toward his last three games" : "; a rule that leans a player's minutes toward his last three games is tested every morning"}. Scoring and shooting streaks mostly fade back toward the season average, so a hot week is not a reason to raise a line.</p></div>

          <div class="tscroll" style="margin-top:8px"><table><thead><tr><th class="l">Week</th><th>Games</th><th>Avg total</th><th>DK line</th><th>Home won</th><th>20+ games</th></tr></thead><tbody>${L.weeks.map(w => `<tr><td class="l">Week ${w.week}</td><td>${w.games}</td><td>${f1(w.total)}</td><td>${w.dk ? f1(w.dk) : "–"}</td><td>${pct(w.homeWin, 0)}</td><td>${w.blowouts}</td></tr>`).join("")}</tbody></table></div></div></div>

          <button class="fbtn" type="button" id="pMovers" data-pa="0" aria-pressed="${!pAll}">Movers</button><button class="fbtn" type="button" id="pEvery" data-pa="1" aria-pressed="${pAll}">Everyone</button></div></div>
