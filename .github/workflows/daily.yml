name: NBA Quant Desk

# GitHub's cron runs on UTC and can start a few minutes late. Times below are US Eastern during daylight time
# (an hour earlier in standard time from November 1).
on:
  schedule:
    # GitHub fired the 6:40 run 29 minutes late on its first day, so each pre-tip slot has an earlier backup
    - cron: '0 15 * * *'    # learn: grade yesterday, recalibrate, audit (11:00 AM ET)
    - cron: '15 22 * * *'   # slate: early pre-tip run (6:15 PM ET)
    - cron: '40 22 * * *'   # slate: first pre-tip run (6:40 PM ET)
    - cron: '40 23 * * *'   # slate: final report before 8:00 PM tips (7:40 PM ET)
    - cron: '15 1 * * *'    # slate: late West Coast games, backup (9:15 PM ET)
    - cron: '40 1 * * *'    # slate: late West Coast games (9:40 PM ET)
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        options: [slate, learn, test, stress]
        default: slate
      date:
        description: 'Slate date yyyy-MM-dd (blank = today ET, or yesterday for learn)'
        required: false
        default: ''
      variants:
        description: 'For test: settings to backtest, e.g. RatePriorMin=300; GammaOverride=1.0'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nbaquant-v2   # v2: runs stuck in the first queue during the 2026-10-30 GitHub incident can't block new ones
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 150
    outputs:
      site: ${{ steps.site.outputs.ready }}
    env:
      TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || (github.event.schedule == '0 15 * * *' && 'learn' || 'slate') }}
    steps:
      - uses: actions/checkout@v4

      - name: Use US Eastern time
        run: tzutil /s "Eastern Standard Time"

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/bbref/NBA_*.csv
            ledger/backtest_latest.csv
          key: nbaq-${{ github.run_id }}
          restore-keys: nbaq-

      - name: Install pdftotext (official injury report)
        if: env.TASK == 'slate'
        run: choco install poppler -y --no-progress

      - name: Build
        shell: cmd
        run: build.bat

      - name: Run ${{ env.TASK }}
        shell: pwsh
        run: ./cloud/daily.ps1 -Task "${{ env.TASK }}" -Date "${{ inputs.date }}" -Variants "${{ inputs.variants }}"

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/bbref/NBA_*.csv
            ledger/backtest_latest.csv
          key: nbaq-${{ github.run_id }}

      - name: Commit results
        if: env.TASK != 'test'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger predictions reports site data/bank data/static overrides settings.ini
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "${{ env.TASK }}: $(Get-Date -Format 'yyyy-MM-dd HH:mm') ET"
            # overlapping runs rewrite the same outputs: replay this run on top of the latest commit and let its files win
            # on conflicts; if that still fails, skip the commit (the website is still published and the next run re-saves)
            for ($i = 0; $i -lt 3; $i++) {
              git fetch origin main
              git rebase -X theirs origin/main
              if ($LASTEXITCODE -ne 0) { git rebase --abort; Write-Host "::warning::Could not rebase results onto origin/main"; break }
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 10
            }
          }
          exit 0

      - name: Upload website
        if: env.TASK != 'test' && hashFiles('_pages/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Website ready?
        id: site
        if: env.TASK != 'test' && hashFiles('_pages/index.html') != ''
        shell: pwsh
        run: '"ready=yes" >> $env:GITHUB_OUTPUT'

  # publishing runs on its own so the Pages environment gate never holds up the model run
  publish:
    needs: run
    if: needs.run.outputs.site == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
